  <!-- Proposed AI engineering lane -->
  <rect x="390" y="690" width="1150" height="150" rx="24" fill="#F5F1FC" stroke="#7654C4" stroke-width="2" stroke-dasharray="9 7"/>
  <rect x="415" y="706" width="265" height="26" rx="13" fill="#7654C4"/>
  <text x="547" y="724" text-anchor="middle" class="pill" fill="#FFFFFF">ข้อเสนอ · วิศวกรรม AI ที่มีการกำกับ</text>
  <text x="705" y="724" class="card-small">ไม่ใช่ผู้ตัดสินใจทางคลินิกอัตโนมัติ</text>

  <g>
    <rect x="420" y="755" width="220" height="58" rx="14" fill="#FFFFFF" stroke="#B9A5E4"/>
