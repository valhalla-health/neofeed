    <text x="438" y="801" class="card-small">PRD · แนวทาง · โครงสร้างข้อมูล · โค้ด</text>
  </g>
  <g>
    <rect x="690" y="755" width="220" height="58" rx="14" fill="#FFFFFF" stroke="#B9A5E4"/>
    <text x="708" y="779" class="card-title" font-size="16">ร่าง + ตรวจสอบ</text>
    <text x="708" y="801" class="card-small">โค้ด · การทดสอบ · หลักฐาน UI</text>
  </g>
  <g>
    <rect x="960" y="755" width="220" height="58" rx="14" fill="#FFFFFF" stroke="#E8B353"/>
    <text x="978" y="779" class="card-title" font-size="16">ขอบเขตความปลอดภัย</text>
