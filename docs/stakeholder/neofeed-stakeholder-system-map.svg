<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">NeoFeed stakeholder system map</title>
  <desc id="desc">A stakeholder-facing graph showing how clinical knowledge and NICU users flow through NeoFeed, its governance controls, measurable value, and a proposed governed AI engineering loop.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324D" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#557187"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0E7C86"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7654C4"/>
    </marker>
    <style>
      .title { font: 700 32px 'Leelawadee UI', 'Noto Sans Thai', Tahoma, 'Segoe UI', sans-serif; fill: #0B1F33; }
      .subtitle { font: 400 16px 'Leelawadee UI', 'Noto Sans Thai', Tahoma, 'Segoe UI', sans-serif; fill: #557187; }
      .section { font: 700 14px 'Leelawadee UI', 'Noto Sans Thai', Tahoma, 'Segoe UI', sans-serif; letter-spacing: .5px; }
      .card-title { font: 700 18px 'Leelawadee UI', 'Noto Sans Thai', Tahoma, 'Segoe UI', sans-serif; fill: #0B1F33; }
      .card-copy { font: 400 14px 'Leelawadee UI', 'Noto Sans Thai', Tahoma, 'Segoe UI', sans-serif; fill: #425D72; }
      .card-small { font: 400 12.5px 'Leelawadee UI', 'Noto Sans Thai', Tahoma, 'Segoe UI', sans-serif; fill: #557187; }
      .pill { font: 700 11px 'Leelawadee UI', 'Noto Sans Thai', Tahoma, 'Segoe UI', sans-serif; letter-spacing: .3px; }
      .edge-label { font: 600 11px 'Leelawadee UI', 'Noto Sans Thai', Tahoma, 'Segoe UI', sans-serif; fill: #557187; }
      .arrow { fill: none; stroke: #557187; stroke-width: 2.2; marker-end: url(#arrow); }
      .arrow-teal { fill: none; stroke: #0E7C86; stroke-width: 2.6; marker-end: url(#arrowTeal); }
      .arrow-purple { fill: none; stroke: #7654C4; stroke-width: 2.4; marker-end: url(#arrowPurple); }
      .feedback { fill: none; stroke: #0E7C86; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrowTeal); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#F6F9FC"/>
  <circle cx="1510" cy="-40" r="220" fill="#DCECEF" opacity="0.7"/>
  <circle cx="-30" cy="890" r="190" fill="#E8E2F8" opacity="0.55"/>

  <text id="titleText" x="60" y="58" class="title">แผนผังระบบ NeoFeed สำหรับผู้มีส่วนได้ส่วนเสีย</text>
  <text x="60" y="89" class="subtitle">จากองค์ความรู้ทางคลินิก สู่กระบวนงานที่กำกับดูแลได้ คุณค่าที่วัดผลได้ และโอกาสใช้ AI อย่างมีขอบเขต</text>

  <g transform="translate(1030,42)">
    <rect x="0" y="0" width="510" height="61" rx="14" fill="#FFFFFF" stroke="#D7E1E8"/>
    <circle cx="22" cy="22" r="6" fill="#0E7C86"/><text x="35" y="27" class="card-small">ใช้งานอยู่</text>
    <circle cx="142" cy="22" r="6" fill="#2F6FED"/><text x="155" y="27" class="card-small">การควบคุม/ข้อมูล</text>
    <circle cx="292" cy="22" r="6" fill="#D88910"/><text x="305" y="27" class="card-small">จุดตัดสินใจ</text>
    <circle cx="410" cy="22" r="6" fill="#7654C4"/><text x="423" y="27" class="card-small">ข้อเสนอ</text>
    <text x="22" y="49" class="card-small">เส้นทึบ = การไหลที่ยืนยันแล้ว · เส้นประ = วงจรป้อนกลับหรืออนาคต</text>
  </g>

  <!-- Section labels -->
  <text x="60" y="145" class="section" fill="#557187">1 · ระบบนิเวศทางคลินิก</text>
  <text x="395" y="145" class="section" fill="#0E7C86">2 · กระบวนงานหลักของ NEOFEED</text>
  <text x="955" y="145" class="section" fill="#2F6FED">3 · การกำกับดูแลและจุดตัดสินใจ</text>
  <text x="1265" y="145" class="section" fill="#1D8A6A">4 · คุณค่าและการตัดสินใจถัดไป</text>

  <!-- Clinical ecosystem -->
  <g filter="url(#shadow)">
    <rect x="60" y="170" width="285" height="125" rx="18" fill="#FFFFFF" stroke="#C8D6E0"/>
    <rect x="60" y="170" width="7" height="125" rx="4" fill="#557187"/>
    <text x="84" y="201" class="card-title">ผู้เกี่ยวข้องกับ NeoFeed</text>
    <text x="84" y="228" class="card-copy">แพทย์ · พยาบาล · ผู้ดูแลระบบ</text>
    <text x="84" y="252" class="card-copy">เภสัชกรรม · ผู้นำหน่วย NICU</text>
    <text x="84" y="276" class="card-copy">ทารก/ครอบครัว = เจ้าของข้อมูลส่วนบุคคล</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="60" y="320" width="285" height="125" rx="18" fill="#FFFFFF" stroke="#B9D7DB"/>
    <rect x="60" y="320" width="7" height="125" rx="4" fill="#0E7C86"/>
    <text x="84" y="351" class="card-title">องค์ความรู้ทางคลินิกที่เชื่อถือได้</text>
    <text x="84" y="378" class="card-copy">แนวทาง PN/EN ของ ESPGHAN</text>
    <text x="84" y="402" class="card-copy">คำแนะนำ WHO · แนวปฏิบัติ KCMH</text>
    <text x="84" y="426" class="card-copy">สูตรคำนวณและข้อมูลผลิตภัณฑ์ที่ตรวจสอบแล้ว</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="60" y="470" width="285" height="125" rx="18" fill="#FFFFFF" stroke="#B9D7DB"/>
    <rect x="60" y="470" width="7" height="125" rx="4" fill="#0E7C86"/>
    <text x="84" y="501" class="card-title">บริบทเฉพาะราย</text>
    <text x="84" y="528" class="card-copy">น้ำหนัก · GA/PMA · อายุหลังคลอด</text>
    <text x="84" y="552" class="card-copy">แผน PN/EN · รับเข้า/ขับออก · การเติบโต</text>
    <text x="84" y="576" class="card-small">แผนผังนี้ไม่มีข้อมูลระดับรายบุคคล</text>
  </g>

  <!-- Core workflow container -->
  <rect x="390" y="165" width="530" height="480" rx="24" fill="#EAF5F5" stroke="#8FC4C9" stroke-width="1.5"/>
  <rect x="410" y="182" width="132" height="24" rx="12" fill="#0E7C86"/>
  <text x="476" y="198" text-anchor="middle" class="pill" fill="#FFFFFF">ใช้งานจริงแล้ว</text>

  <g filter="url(#shadow)">
    <rect x="425" y="225" width="205" height="95" rx="17" fill="#FFFFFF" stroke="#8FC4C9"/>
    <text x="448" y="256" class="card-title">ทะเบียนผู้ป่วย</text>
    <text x="448" y="281" class="card-copy">รับเข้า · แก้ไข · จำหน่าย</text>
    <text x="448" y="303" class="card-small">แสดงรายที่ยังต้องบันทึกวันนี้</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="675" y="225" width="210" height="95" rx="17" fill="#FFFFFF" stroke="#8FC4C9"/>
    <text x="698" y="256" class="card-title">เครื่องคำนวณ 6 ขั้นตอน</text>
    <text x="698" y="281" class="card-copy">TPN + EN + อิเล็กโทรไลต์</text>
    <text x="698" y="303" class="card-small">บุคลากรยอมรับหรือปรับแก้ได้</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="425" y="370" width="205" height="95" rx="17" fill="#FFFFFF" stroke="#8FC4C9"/>
    <text x="448" y="401" class="card-title">บันทึกโภชนาการรายวัน</text>
    <text x="448" y="426" class="card-copy">บันทึกตามทารกและวันที่</text>
    <text x="448" y="448" class="card-small">แก้ไขและลงข้อมูลย้อนหลังได้</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="675" y="370" width="210" height="95" rx="17" fill="#FFFFFF" stroke="#8FC4C9"/>
    <text x="698" y="401" class="card-title">แนวโน้ม + Fenton 2025</text>
    <text x="698" y="426" class="card-copy">โภชนาการและการเติบโตในมุมมองเดียว</text>
    <text x="698" y="448" class="card-small">น้ำหนักตรวจสอบแล้ว; ความยาว/HC รอทบทวน</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="425" y="515" width="460" height="95" rx="17" fill="#FFFFFF" stroke="#8FC4C9"/>
    <text x="448" y="546" class="card-title">การแจ้งเตือน + ภาพรวมผู้ดูแลระบบ</text>
    <text x="448" y="571" class="card-copy">เตือนน้ำหนักเก่า · ภาพรวมหลายราย · ขั้นตอนแก้ไข</text>
    <text x="448" y="593" class="card-small">รองรับงานราวนด์ ไม่แทนวิจารณญาณทางคลินิกหรือเวชระเบียน</text>
  </g>

  <!-- Trust and gates -->
  <g filter="url(#shadow)">
    <rect x="955" y="190" width="270" height="92" rx="17" fill="#FFF7E8" stroke="#E8B353"/>
    <rect x="955" y="190" width="7" height="92" rx="4" fill="#D88910"/>
    <text x="980" y="220" class="card-title">การรับรองทางคลินิก</text>
    <text x="980" y="246" class="card-copy">บุคลากรทางคลินิกทบทวนทุกแผน</text>
    <text x="980" y="267" class="card-small">NeoFeed เป็นเครื่องมือช่วยคำนวณ</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="955" y="305" width="270" height="92" rx="17" fill="#EDF3FF" stroke="#9DB8F2"/>
    <rect x="955" y="305" width="7" height="92" rx="4" fill="#2F6FED"/>
    <text x="980" y="335" class="card-title">ยืนยันตัวตน + สิทธิ์ตามบทบาท</text>
    <text x="980" y="361" class="card-copy">เข้าสู่ระบบแบบผสม · เซสชัน 6 ชม.</text>
    <text x="980" y="382" class="card-small">สิทธิ์แพทย์ · พยาบาล · ผู้ดูแลระบบ</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="955" y="420" width="270" height="92" rx="17" fill="#EDF3FF" stroke="#9DB8F2"/>
    <rect x="955" y="420" width="7" height="92" rx="4" fill="#2F6FED"/>
    <text x="980" y="450" class="card-title">GAS + Sheets + บันทึกตรวจสอบ</text>
    <text x="980" y="476" class="card-copy">ข้อมูลปฏิบัติงาน + ร่องรอยความรับผิดชอบ</text>
    <text x="980" y="497" class="card-small">รองรับการลบตาม PDPA; ระยะเก็บข้อมูลยังไม่กำหนด</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="955" y="535" width="270" height="92" rx="17" fill="#FFF7E8" stroke="#E8B353"/>
    <rect x="955" y="535" width="7" height="92" rx="4" fill="#D88910"/>
    <text x="980" y="565" class="card-title">จุดตรวจความปลอดภัยก่อนเผยแพร่</text>
    <text x="980" y="591" class="card-copy">ตรวจทางคลินิก · ทดสอบการถดถอย</text>
    <text x="980" y="612" class="card-small">มนุษย์ทบทวน + เผยแพร่อย่างควบคุม</text>
  </g>

  <!-- Value and decisions -->
  <g filter="url(#shadow)">
    <rect x="1265" y="190" width="275" height="92" rx="17" fill="#ECF8F3" stroke="#94CDB8"/>
    <text x="1288" y="220" class="card-title">แบบคำสั่งสำหรับเภสัชกรรม</text>
    <text x="1288" y="246" class="card-copy">พิมพ์คำสั่งโภชนาการเพื่อทบทวน</text>
    <text x="1288" y="267" class="card-small">แพทย์ยังเป็นผู้มีอำนาจสั่งการรักษา</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1265" y="305" width="275" height="92" rx="17" fill="#ECF8F3" stroke="#94CDB8"/>
    <text x="1288" y="335" class="card-title">เห็นงานประจำวันชัดเจน</text>
    <text x="1288" y="361" class="card-copy">บันทึกแล้ววันนี้ เทียบกับ ยังต้องบันทึก</text>
    <text x="1288" y="382" class="card-small">ช่วยให้งานราวนด์ครบถ้วน</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1265" y="420" width="275" height="92" rx="17" fill="#ECF8F3" stroke="#94CDB8"/>
    <text x="1288" y="450" class="card-title">ติดตามระยะยาวและตรวจสอบย้อนหลัง</text>
    <text x="1288" y="476" class="card-copy">โภชนาการ · การแก้ไข · การเติบโต</text>
    <text x="1288" y="497" class="card-small">ก้าวพ้นการคำนวณเพียงวันเดียว</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1265" y="535" width="275" height="110" rx="17" fill="#FFFFFF" stroke="#D88910" stroke-width="1.5"/>
    <text x="1288" y="565" class="card-title">การตัดสินใจของผู้เกี่ยวข้อง</text>
    <text x="1288" y="589" class="card-small">1. ยืนยันแหล่งข้อมูลทางคลินิก</text>
    <text x="1288" y="609" class="card-small">2. กำหนดเจ้าของระบบ + ผู้ทบทวนคนที่สอง</text>
    <text x="1288" y="629" class="card-small">3. กำหนดระยะเก็บข้อมูล + ค่าตั้งต้นตัวชี้วัด</text>
  </g>

