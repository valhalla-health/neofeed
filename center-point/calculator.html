<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NeoFeed · CP TPN staging</title><link rel="stylesheet" href="/neofeed/calculator.css"><link rel="stylesheet" href="/style.css"></head><body><main style="margin:auto;max-width:1200px;padding:20px"><a href="/neofeed/">กลับการรับเข้า NeoFeed</a><h1>TPN → ตรวจชื่อที่ Center Point</h1><p>ข้อมูลสมมติเท่านั้น · ยังไม่เปิดใช้เป็นใบสั่งจริง</p><p id="context"></p><p id="feedback" role="status"></p><form id="setup"><label>น้ำหนักแรกเกิด (g)<input name="bw" type="number" min="1" required></label><label>อายุครรภ์ (สัปดาห์)<input name="ga" type="number" min="1" required></label><label>DOL<input name="dol" type="number" min="1" required></label><label>วันที่ชั่งน้ำหนัก<input name="measured" type="date" required></label><label>วันที่ให้ TPN<input name="order" type="date" required></label><label>เริ่มใช้แผน (เวลาไทย)<input name="from" type="datetime-local" required></label><label>สิ้นสุดแผน (เวลาไทย)<input name="to" type="datetime-local" required></label><label>แหล่งนมในแผน<select name="source"><option value="mixed">ยังไม่แยกนมแม่ / หลายชนิด</option><option value="mothers_milk">นมแม่ล้วนก่อนเสริม</option><option value="donor_milk">นมบริจาค</option><option value="formula">นมผสม</option></select></label><button>เปิดเครื่องคำนวณสำหรับการรับเข้านี้</button></form><div id="calculator"></div><section id="review" hidden><h2>ทบทวนฉบับที่บันทึกใน CP</h2><p id="revision"></p><div id="document"></div><label><input type="checkbox" id="checked">ตรวจข้อมูลครบทั้งฉบับแล้ว</label><label>เหตุผลเมื่อแก้ฉบับเดิม<select id="reason"><option value="">เลือกเหตุผล</option><option value="plan_change">เปลี่ยนแผน</option><option value="entry_correction">แก้ข้อมูล</option><option value="measurement_correction">แก้น้ำหนัก</option></select></label><button id="publish">ยืนยันฉบับนี้</button><label>เครื่องปลายทาง<input id="workstation" autocomplete="off"></label><button id="print-job">ส่งตรวจชื่อและพิมพ์</button><p id="job"></p></section></main><script type="module" src="/neofeed/calculator.js"></script></body></html>
