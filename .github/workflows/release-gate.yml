# NF-05: a PR into `release` is the promotion of a pilot, not a straight copy of
# `main`. Since 2026-10-28 a release first runs on the `pilot` branch's preview
# (pilot-neofeed.valhalla-health.workers.dev) for 48 h, used by Pp and one fellow,
# while the ward stays on the previous release. tools/release-gate.mjs reads the
# release PR and fails until it comes from `pilot`, names the commit the pilot ran,
# that pilot is 48 h old, the rollback target is named and every box is ticked.
#
# This check is NOT required on `release` (only `harnesses` is), so Pp can merge
# over it with her reason written in the PR: a release that cannot be piloted
# side by side, or a fix that cannot wait. Making it required is her call
# (REFERENCE.md § The pilot ladder). It runs again whenever the PR body is edited,
# so ticking the last box turns it green.
name: release-gate

on:
  pull_request:
    branches: [release]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  promotion-checklist:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The body reaches the script as an environment variable, never inside the
      # shell command, so nothing typed in a PR runs here.
      - name: The release PR is a promotion from the pilot (NF-05)
        env:
          PR_BASE: ${{ github.base_ref }}
          PR_HEAD: ${{ github.head_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node tools/release-gate.mjs
