# Runs every test/verify-*.cjs harness and the HTML-shell identity check.
#
# NeoFeed prints pharmacy orders, and until 2026-09-11 nothing ran these
# harnesses automatically — they were run by hand before a push, and a push
# to main is a production deploy (STATUS.md § Release-branch deploy gate).
# This job is meant to be a REQUIRED status check on `release`, so a
# main → release PR cannot merge red. See IMPROVEMENT_SPEC_2026-09-04.md § 3.2.
#
# Since 2026-09-17 the frontend has a build step (tools/build.mjs) whose output
# is COMMITTED: both hosts serve compiled/, vendor/ and the shells straight
# from git, and no build ever runs on a host. So this job does three things
# with it: rebuilds from the .jsx sources and fails if that changes a single
# byte (stale or hand-edited output cannot merge), runs every harness against
# the sources as before, and runs them all again against the compiled files
# that actually ship. The test npm packages below are dev-only, installed here
# and never committed — the same command test/README.md documents.
name: test

on:
  pull_request:
  push:
    branches: [main, release]

permissions:
  contents: read

jobs:
  harnesses:
    runs-on: ubuntu-latest
    # 30, not 20, since 2026-09-23: the three calculator harnesses added that
    # day (oracle, clicks, fuzz) cost about two minutes per mode, and every
    # harness here runs twice — once against the sources, once against
    # compiled/. A deeper fuzz run is deliberately NOT the default: FUZZ_N=500
    # is for a local session, not for every PR. 45, not 30, since 2026-10-04: the
    # browser sections now run here too, once, in the compiled pass (about ten
    # minutes on a laptop; see the Playwright step below).
    timeout-minutes: 45
    env:
      # The ward's timezone. The app pins Asia/Bangkok itself; running the
      # harnesses in it too matches how they are run locally.
      TZ: Asia/Bangkok
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # NF-32: every check is listed in tools/checks.json, each with a dimension
      # and a blocking flag, and tools/run_checks.js is the one command that runs
      # them. The pre-commit and Stop hooks call the same runner, so a check added
      # once runs at every level. Add a check there, not as a step here. The
      # steps below only set up what each phase needs.
      #
      # pre: a fresh build must change no byte of compiled/, vendor/ or the shells
      # (stale or hand-edited output cannot merge; this runs first, before
      # anything else writes to the tree), the two HTML shells are identical, and
      # tools/ci_bans.js with its self-test (NF-19, NF-08).
      - name: Build, shells and CI bans
        run: node tools/run_checks.js --level ci --phase pre

      - name: Install dev-only test dependencies (not committed)
        run: npm install --no-save --no-package-lock react@18 react-dom@18 @babel/core@7 @babel/preset-react@7 jsdom@30

      - name: Every harness, against the sources
        run: node tools/run_checks.js --level ci --phase sources

      # Eight harnesses have browser sections (the phone sweep, mobile fit, the
      # admin census, ...) that need Playwright and a Chromium and print SKIP
      # without them. Until 2026-10-04 nothing here installed either, so those
      # sections had only ever run on a laptop. They run once, in the compiled
      # pass below, against the files that ship. Playwright lives in its own
      # folder and is reached through NODE_PATH in that pass only: installing it
      # into ./node_modules would prune the --no-save packages installed above,
      # and the sources pass keeps its SKIP so the browser time is spent once.
      - name: Install Playwright and Chromium (compiled pass only)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium

      # The same harnesses, with every .jsx module they mount replaced by the
      # compiled/*.js file the browser actually runs (test/compiled-loader.cjs).
      # The runner fails a harness that mounts modules but swapped none, so the
      # preload cannot silently fall back to testing the sources, and fails a
      # browser SKIP, so a broken Playwright install cannot pass as green again.
      - name: Every harness, against the shipped compiled/*.js, with the browser sections
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node tools/run_checks.js --level ci --phase compiled

      # Center Point serves a bundle of calculator.jsx built from center-point/
      # (PR #57). Without this, a change that breaks that bundle or CP's client
      # passed CI; the harnesses above load the sources, not the bundle.
      - name: Center Point builds and its client tests pass
        run: node tools/run_checks.js --level ci --phase center-point
