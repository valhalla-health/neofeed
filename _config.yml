# GitHub Pages (legacy "deploy from a branch" mode, no .nojekyll) runs Jekyll
# on every deploy. Cloudflare already has an allow-list equivalent in
# .assetsignore ("Everything the running app needs is index.html,
# manifest.json, moved.html, boot.js, data.js, compiled/, vendor/ and icons/.
# Anything not on that list belongs below."); this file gives GitHub Pages the
# same exclusions so it stops publishing internal docs, backend source and
# dev-only files. Jekyll already skips dotfiles/dot-directories by default
# (.git, .claude, .wrangler, .gitleaks.toml, etc.) — only non-dotfile paths
# need listing here.
#
# Never list boot.js here: on this host it is the retirement guard that sends
# visitors to moved.html. compiled/ and vendor/ stay published too, and so do
# the .jsx sources for the 2026-09-17 release (see .assetsignore).
# test/verify-build-shells.cjs checks all of this.
exclude:
  - "*.md"
  - gas-backend.gs
  - docs/
  - test/
  - node_modules/
  # The build (tools/build.mjs): runs in CI and on developer machines, never here.
  - tools/
  # Center Point staging entry (PR #57): served by CP, never by NeoFeed's host.
  - center-point/
  - graphify-out/
  - NeoFeed.html
  - wrangler.jsonc
