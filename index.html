    .reg-stats { flex-wrap: wrap; }
    .reg-stat  { flex: 0 0 calc(50% - 5px); }
    .reg-filter { flex-wrap: wrap; }
    .reg-filter .reg-search { max-width: 100%; }
    .reg-filter .reg-search .s-clear { width: 44px; height: 44px; right: 0; }
    .reg-filter .reg-search .inp { padding-right: 46px; }
    .name-foreign { min-height: 44px; }

    /* ── Overscroll: prevent Android/iOS rubber-band on body ── */
    body { overscroll-behavior: none; }

    /* ── Toast: move above bottom nav ── */
    :root { --toast-bottom: calc(70px + env(safe-area-inset-bottom, 0px)); }

    /* ── Bottom nav active pip ── */
    .bnav-item.active::after {
      content: '';
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 24px; height: 3px;
      background: var(--brand);
      border-radius: 0 0 3px 3px;
    }

    /* ── Responsive grids ── */
    .admin-stat-tiles  { grid-template-columns: 1fr 1fr !important; }
    .alert-summary-tiles { grid-template-columns: 1fr 1fr 1fr !important; }
    .guidelines-grid   { grid-template-columns: 1fr !important; }
    .capo4-tiles       { grid-template-columns: 1fr !important; }

    /* Feeding advancement: 5-col → vertical cards */
    .feeding-steps-grid { grid-template-columns: 1fr !important; }
    .feeding-steps-grid > div { border-right: none !important; border-bottom: 1px solid var(--line-2) !important; }
    .feeding-steps-grid > div:last-child { border-bottom: none !important; }

    /* ── Android UX: step header chips wrap to own row ── */
    /* Without this, long titles ("Step 4 · Vitamins · Trace Elements · Heparin")
       push chips off-screen on 360px Android widths */
    .card-h.clickable { flex-wrap: wrap; row-gap: 4px; }
    .step-summary {
      flex: 0 0 100%;    /* own row */
      margin-left: 0;
      overflow: visible; /* don't clip chips */
      padding: 0 0 4px;
    }
    .step-summary-chip { font-size: 12px; padding: 3px 8px; }

    /* ── Android UX: EN fields — 2-col + MEN full width ── */
    .en-fields-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) !important; }
    .en-men-col    { grid-column: 1 / -1; }

    /* ── Android UX: readability — bump small inline font sizes ── */
    .chk-label  { font-size: 14px !important; }
    .chk-hint   { font-size: 12px !important; }
    .field-hint { font-size: 12px !important; }
    .salt-note  { font-size: 12px !important; }

    /* Patient strip: 9px label → 11px minimum, let it grow instead of clipping */
    .patient-strip .lbl { font-size: 11px !important; height: auto !important; min-height: 20px; }

    /* ── Patient picker rows: 5-col → 2-row layout ── */
    /* Desktop: "140px 1fr 100px 80px 90px" — too wide for 360px Android */
    /* Mobile: name | bed | GA on row 1, diagnosis on row 2 */
    .picker-row {
      grid-template-columns: 1fr auto auto !important;
      grid-template-rows: auto auto !important;
      gap: 4px 10px !important;
      padding: 10px 14px !important;
      align-items: center !important;
    }
    .picker-row > span:nth-child(1) { grid-column: 1; grid-row: 1; font-size: 15px; }
    .picker-row > span:nth-child(2) { grid-column: 1 / -1; grid-row: 2; font-size: 11.5px; color: var(--ink-3); }
    .picker-row > span:nth-child(3) { grid-column: 2; grid-row: 1; }
    .picker-row > span:nth-child(4) { grid-column: 3; grid-row: 1; font-size: 12px; }
    .picker-row > span:nth-child(5) { display: none !important; }
  }

  /* ============ RESPONSIVE GRID HELPERS (targeted by className) ============ */
  /* Admin stat tiles: 4-col → 2-col on mobile */
  .admin-stat-tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
  /* Guidelines 2-col grids */
  .guidelines-grid  { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  /* Alert summary 3-col tiles */
  .alert-summary-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
  /* ── Admin census (UX roadmap #2, 2026-09-24) — one card per ward. Cards,
     not a table, so a phone gets one column and the page never scrolls
     sideways (verify-admin-census § 4); min() keeps the 240px track from
     overflowing a 280px screen. Status colours are the -ink cuts, and only
     on a number that is a finding. */
  .census-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 12px; }
  .census-ward { min-width: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
  .census-ward.total { background: var(--bg-2); }
  .census-ward-h { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 10px; flex-wrap: wrap; }
  .census-ward-name { font-size: 16px; font-weight: 600; color: var(--brand-2); letter-spacing: -0.01em; }
  .census-beds { font-size: 12px; color: var(--ink-3); }
  .census-bar { height: 6px; margin: 8px 0 10px; border-radius: 999px; background: var(--line-2); overflow: hidden; }
  .census-bar > span { display: block; height: 100%; border-radius: inherit; background: var(--brand-3); }
  .census-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 10px; margin-top: 8px; }
  .census-stat .v { font-size: 20px; font-weight: 600; color: var(--ink); line-height: 1.2; }
  .census-stat .l { font-size: 11px; color: var(--ink-3); line-height: 1.3; }
  .census-stat.ok   .v { color: var(--ok-ink); }
  .census-stat.warn .v { color: var(--warn-ink); }
  .census-stat.crit .v { color: var(--crit-ink); }
  .census-note  { margin-top: 10px; font-size: 12px; color: var(--ink-3); line-height: 1.5; }
  .census-flags { margin-top: 10px; padding: 8px 10px; font-size: 12.5px; line-height: 1.5; color: var(--warn-ink); background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: var(--r-sm); }
  /* ── Nursing I/O (UX roadmap #4, 2026-09-24) — the Dashboard's daily-totals
     card and its form. Each row is a button (it opens that day's record), so
     it is at least 44px tall on any device; its figures wrap onto more lines
     rather than widen the page (verify-nursing-frontend § 6). */
  .nio-head { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .nio-head .log-badge { font-size: 11px; padding: 3px 9px; }
  .nio-add { min-height: 44px; }
  .nio-empty, .nio-more { font-size: 12.5px; color: var(--ink-3); line-height: 1.5; }
  .nio-more { margin-top: 8px; }
  .nio-list { border: 1px solid var(--line-2); border-radius: var(--r-sm); overflow: hidden; }
  .nio-row { display: grid; grid-template-columns: minmax(92px, auto) minmax(0, 1fr) auto; align-items: center; gap: 4px 12px;
    min-height: 44px; padding: 8px 12px; border-top: 1px solid var(--line-2); background: var(--surface); cursor: pointer; }
  .nio-row:first-child { border-top: 0; }
  .nio-row:hover { background: var(--bg-2); }
  .nio-row:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; }
  .nio-date { display: flex; flex-direction: column; font-size: 13px; line-height: 1.3; }
  .nio-dol { font-size: 11px; color: var(--ink-3); }
  .nio-vals { display: flex; flex-wrap: wrap; gap: 2px 14px; min-width: 0; font-size: 12.5px; color: var(--ink-2); overflow-wrap: anywhere; }
  .nio-who { display: flex; align-items: center; justify-content: flex-end; gap: 6px; font-size: 11.5px; color: var(--ink-3); }
  /* .btn.sm is two classes and 32px on a mouse-driven desktop; this must outrank it. */
  .btn.nio-del { min-width: 44px; min-height: 44px; justify-content: center; }
  .nio-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .nio-sum { padding: 8px 10px; font-size: 13px; color: var(--ink-2); background: var(--bg-2); border-radius: var(--r-sm); }
  .nio-note { font-size: 11.5px; color: var(--ink-3); line-height: 1.5; }
  .nursing-modal .picker-h .icon-btn { width: 44px; height: 44px; flex-shrink: 0; }
  @media (max-width: 480px) {
    /* Date and who on the first line, the figures under them at full width. */
    .nio-row { grid-template-columns: minmax(0, 1fr) auto; }
    .nio-vals { grid-column: 1 / -1; grid-row: 2; }
  }
  @media (max-width: 340px) { .nio-grid { grid-template-columns: minmax(0, 1fr); } }
  /* Recent log entries keeps its seven columns; on a phone it scrolls inside
     its own card instead of widening the page. */
  .admin-recent { overflow-x: auto; }
  /* Step 6 Ca · PO₄ · Ca:P total tiles: 3-col → 1-col on mobile (see mobile block) */
  .capo4-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  /* Feeding advancement 5-col vertical stack */

  /* ============ REDUCED MOTION ============ */
  /* Vestibular safety, and a real performance floor on the ward's older

     down instead of each component having to remember. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {

      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;

  /* ============ PRINT STYLES ============ */
  @media print {
    /* Hide all UI — show only Ramathibodi print form */
    .topbar, .rail, #toast-host, .picker-backdrop,
    .switch-patient, .patient-strip, .page-head, .disclaimer-bar,
    .card, .step-summary, .preset-chips { display: none !important; }
    /* Everything in the workspace except the order form itself — the edit/

       outside .card and used to print above the pharmacy form. */
    .work-inner > :not(#print-form), .bottom-nav, .quick-fab, .app > [role="status"] { display: none !important; }

    html, body { height: auto; background: #fff; }
    .app { display: block; height: auto; min-height: auto; overflow: visible; }
    .work { overflow: visible; }
    .work-inner { padding: 0; max-width: 100%; }

    /* Show the print form */
    #print-form { display: block !important; }

    @page { size: A4 portrait; margin: 8mm 10mm; }
  }
