<style>
  :root {
    --toast-bottom: 24px;

    /* ══ VALHALLA HEALTH PALETTE ═══════════════════════════════════════
       The brand sheet's seven colours, converted into oklch (the space the
       rest of this file is already written in) so every tint, hover and
       hairline below can be derived by moving L/C along the same hue
       instead of being matched by eye:

         Midnight Teal   #103F43   oklch(33.9% 0.049 203)
         Valhalla Teal   #12656A   oklch(46.3% 0.074 201)
         Neo Teal        #16838A   oklch(55.7% 0.090 202)
         Sea Glass       #78BFC0   oklch(75.8% 0.071 197)
         Mineral Mist    #D5ECEA   oklch(92.6% 0.024 190)
         Nordic Sand     #D4B98C   oklch(79.8% 0.067  80)
         Porcelain Mist  #F5F8F7   oklch(97.7% 0.003 174)

       ONE COLOUR ON THAT LIST IS NO LONGER USED AS THE ACCENT. Valhalla Teal
       was --brand until 2026-09-22, when Praew moved the accent onto the
       NeoFeed mark's Forest so the logo and the controls under it are one
       colour ("ใช้สีนี้ แทน valhalla teal แทนเท่านั้น"). The surfaces, the ink
       and the hairlines below are still this sheet's; only the --brand ramp
       is § 11's. The teal names stay here because they are what the
       Porcelain-Mist ground and the teal-leaning ink tiers were derived from.

       The three clinical status colours further down are deliberately NOT
       from the brand sheet. crit and warn are byte-identical to the
       pre-Valhalla palette. ok kept its hue family but gained chroma on
       2026-09-22: once the accent had moved onto the mark's green, the old
       OK green read as brand (Praew: "สีเขียวอยากให้ชัดไปจาก palette เดิม
       เลย"). crit/warn/ok are what severity is read off at a glance at a
       bedside; re-hueing them to match a brand would move a mapping the ward
       has already learned. The brand green never means "normal".

       Every text tier here was checked against --surface and --bg-2 with a
       WCAG ratio, not by eye — the ratios are noted inline. */

    /* ── surfaces — Porcelain Mist neutral (hue ~195, near-zero chroma) ── */
    --bg:        oklch(97.7% 0.004 195);   /* Porcelain Mist */
    --bg-2:      oklch(95.6% 0.006 195);
    --surface:   #ffffff;
    --surface-2: oklch(99% 0.003 195);
    --line:      oklch(90.5% 0.008 198);
    --line-2:    oklch(94% 0.006 198);

    /* ── type — teal-leaning charcoal, so body text sits inside the brand
       family instead of reading blue next to it ── */
    --ink:       oklch(24% 0.022 205);     /* 16.4:1 on white */
    --ink-2:     oklch(40% 0.020 205);     /*  9.1:1 on white */
    --ink-3:     oklch(53.5% 0.016 203);   /*  5.1:1 on white, 4.5:1 on --bg-2 */
    --ink-4:     oklch(63% 0.015 201);     /* dimmed tier — placeholders, em-dashes */

    /* ── brand ramp: THE ACCENT IS THE MARK'S GREEN, NOT THE SHEET'S TEAL ──
       Praew, 2026-09-22: "ถ้าส่วนเนื้อหาด้านใน ใช้สีนี้ แทน valhalla teal
       แทนเท่านั้น" — the app's accent is the Forest the NeoFeed mark is drawn
       in, so the logo in the corner and the buttons under it are one colour.
       The ramp is Brand Handbook § 11's, already contrast-solved there.

       THE REST OF THE PALETTE DELIBERATELY DID NOT FOLLOW. The surfaces above
       stay Porcelain Mist, the ink stays teal-leaning charcoal, the hairlines
       stay neutral. A full-green sheet was tried on 2026-09-22 and reverted the
       same day — "สีข้างในมันกลืนกันไปหน่อย ไม่โอเค" — because when the ground,
       the structure AND the accent are one hue family there is nothing left to
       separate them with and the app reads as a single wash. A green accent on
       a cool neutral ground is the opposite arrangement, and it is the one that
       works. If a future refresh wants to move the ground too, that is the
       failure to design against; "แทนเท่านั้น" is load-bearing. ── */
    --brand-ink:  oklch(29% 0.042 170);    /* text on brand tints — 11.87:1 on --brand-bg */
    --brand-2:    oklch(33% 0.045 170);    /* hover / pressed for primary */
    --brand:      oklch(38.5% 0.047 170);  /* Forest #284C40 — THE accent, and the mark's */
    --brand-3:    oklch(55.7% 0.047 170);  /* meters, sparklines */
    --brand-4:    oklch(82.4% 0.039 139);  /* Sage #B9CCB4 — fills, chart bands */
    --brand-line: oklch(87.6% 0.031 148);  /* Celadon #C9DCCB */
    --brand-bg:   oklch(94.5% 0.016 150);
    --brand-bg-2: oklch(93.6% 0.020 136);  /* Pale Jade #E4EDE0 */

    /* ── Nordic Sand — the sheet's one warm note, and DECORATIVE ONLY:
       hairline rules, the wordmark underline, empty-state marks. Never a
       status. It sits at hue 80, next door to --warn at 65, and a warm chip
       that does not mean "caution" is the one confusion this app can least
       afford. ── */
    --sand:      oklch(79.8% 0.067 80);
    /* Deliberately no --sand-bg / --sand-line. A sand *tint* token is the
       thing that would tempt the next chip or badge into the warm family,
       which is exactly what the note above rules out. If sand ever needs a
       second value, that is a decision to take on purpose, not a token
       sitting ready. */

    /* ── status — restrained traffic-light, only for clinical severity ── */
    --crit:      oklch(54% 0.20 22);
    --crit-bg:   oklch(96.5% 0.03 22);
    --crit-line: oklch(85% 0.08 22);
    --crit-ink:  oklch(44% 0.16 22);       /* 8.5:1 — crit as *text* */

    --warn:      oklch(63% 0.16 65);
    --warn-bg:   oklch(96.5% 0.04 75);
    --warn-line: oklch(86% 0.10 70);
    /* --warn is 3.6:1 on white: a fill/stripe colour, not a text one. This
       is the darker cut (7.7:1) that was hardcoded in 14 separate places
       across five files for warn *text* — the same value, now named once,
       so adopting it is a pure rename with no pixel changing anywhere.
       Both --warn and --warn-ink are outside the sRGB gamut and are gamut-
       mapped by the browser (to ~#c97000 and ~#844100). Left as-is
       deliberately: the in-gamut equivalents look identical on an sRGB
       panel, but the ward reads this on P3 iPads, where the current specs
       render the more saturated amber that is already the learned signal.
       Pinning them would quietly desaturate a clinical colour. */
    --warn-ink:  oklch(45% 0.13 65);

    /* ok is its own green now, clear of the Forest accent and the Sage
       tints: more chroma at the same lightness, not a new hue (it was
       oklch(52% 0.12 155), #177C49). This is the most vivid green at this
       hue that stays sRGB and >= 4.5:1 on white, and it has to: about a
       dozen places use --ok as small text. */
    --ok:        oklch(52% 0.15 148);      /* #017F31 · 5.15:1 on white, 4.73:1 on --ok-bg */
    --ok-bg:     oklch(96.5% 0.045 150);
    --ok-line:   oklch(82% 0.12 150);
    --ok-ink:    oklch(42% 0.12 148);      /* #035E23 · 8.0:1 — ok as *text* */

    /* ── range-bar zones (calculator.jsx Meter) ──
       Green inside the target, yellow outside it, red past a hard limit, and
       a deeper green for GIR's 8-10 optimum (Praew, 2026-09-22: "สีเขียว OK,
       สีเหลืองระวัง สีแดง alert"). Tints, not the status colours themselves,
       so the ink needle reads on every one of them. */
    --zone-ok:   oklch(90% 0.055 150);
    --zone-best: oklch(83% 0.085 148);
    --zone-warn: oklch(94% 0.048 90);
    --zone-crit: oklch(89% 0.055 22);

    --info:      oklch(50% 0.10 240);

    /* ── card frame: the pale blue the app's structure was drawn in before
       2026-09-21, back on Praew's request ("กลับไปใช้กรอบ แนวๆ สีฟ้าคล้ายของ
       เก่า เพื่อให้แยกได้ชัด", 2026-09-22). STRUCTURE ONLY: card borders,
       card header bands, the ward tiles. Never a status and never the
       accent, so buttons, focus rings and selected states stay Forest. ── */
    --frame:        oklch(85% 0.04 232);   /* card border · 1.46:1 on --bg, where --line was 1.24:1 */
    --frame-head:   oklch(94.5% 0.028 232);/* header band, top stop — fades to white */
    --frame-head-2: oklch(92% 0.036 232);  /* header hover / pressed */
    --frame-rule:   oklch(86% 0.04 232);   /* header's bottom rule */
    --frame-ink:    oklch(33% 0.07 240);   /* #083955 · header title, 10.4:1 on --frame-head */

    /* ── radii + elevation ──
       Shadows carry the brand's hue rather than neutral grey: on a
       Porcelain-Mist page a grey shadow reads as dirt, a teal-tinted one
       reads as depth. */
    --r-sm: 6px;
    --r:    10px;
    --r-lg: 14px;
    --r-xl: 20px;
    --shadow-card: 0 1px 0 oklch(92% 0.008 198 / .55), 0 1px 2px oklch(25% 0.02 205 / .05);
    --shadow-pop:  0 4px 14px oklch(25% 0.02 205 / .10), 0 1px 2px oklch(25% 0.02 205 / .06);
    --shadow-lift: 0 10px 30px oklch(25% 0.03 205 / .10), 0 2px 6px oklch(25% 0.02 205 / .06);

    /* One focus ring, used by every interactive surface in the file. Same
       hue as --brand, so the ring belongs to the accent that moved. */
    --ring: 0 0 0 3px oklch(38.5% 0.047 170 / .18);

    --rail-w: 232px;
    --header-h: 56px;
  }

  * { box-sizing: border-box; }
  ::selection { background: var(--brand-bg-2); color: var(--brand-ink); }

  /* One visible focus ring for every interactive surface. :focus-visible, so
     it appears for keyboard and assistive navigation and never on a mouse
     tap — the ward runs this both on touch tablets and on a keyboard-driven
     workstation, and before this the rail, the nav and every ghost button
     were keyboard-reachable with nothing drawn to say where you were. */
  :where(button, a, [role="button"], summary, [tabindex]:not([tabindex="-1"])):focus-visible {
    outline: 2px solid var(--brand);
    outline-offset: 2px;
    /* No border-radius here on purpose: `outline` already follows the
       element's own radius, so setting one would reshape the control on
       focus rather than just ring it. :where() keeps this at zero
       specificity so any component that wants a different ring still wins. */
  }
  /* Inputs draw their own ring (border + --ring); don't double it up. */
  .inp:focus-visible, .sel:focus-visible { outline: none; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    /* IBM Plex Sans has no Thai glyphs, so Thai characters always fall back —
       "IBM Plex Sans Thai" is IBM's companion cut, metrics-matched to
       "IBM Plex Sans" specifically for mixed Thai/Latin text like this app's
       labels ("ชื่อย่อ (อักษรแรกของชื่อ + นามสกุล)"). It must come before
       "Sarabun" (an unrelated typeface with different x-height/weight) or
       every Thai string renders visibly larger/heavier than the Latin text
       next to it at the same declared font-size. Sarabun stays as a last-
       resort fallback only. */
    font: 14px/1.45 "IBM Plex Sans", "IBM Plex Sans Thai", "Sarabun", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .mono, .num { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; }
  input, select, textarea { font: inherit; color: inherit; }

  /* ── Touch: remove 300ms delay + suppress native tap highlight everywhere ── */
  button, a, .btn, .clickable, .preset-chip, .seg button,
  .card-h, .bnav-item, .rail-item, .switch-patient, .icon-btn {
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  /* ============ APP SHELL ============ */
  /* Three rows, not two: topbar / banner / body. The middle row is `auto`, so
     it is exactly 0px tall on the ordinary day when no banner is rendered —
     but it has to EXIST, and .rail/.work have to be placed explicitly below
     it, because grid auto-placement was the bug here.

     App renders the offline/staleness banner as a bare <div role="status">
     child of .app with no placement of its own. With two rows and everything
     after .topbar auto-placed, the banner took the first free cell — which was
     the RAIL's (row 2, column 1) — shunting .rail into the workspace column
     and .work into an implicit third row that `overflow: hidden` then clipped.
     Measured in Chromium at 1440px: the workspace collapsed from 1208px wide
     to 232px and lost 654px of its height; at 390px it was pushed below the
     fold entirely. So the layout broke precisely when the app was offline or
     its data was >15 min old — the two states the banner exists to announce,
     and the two where a nurse most needs to reach the numbers.
     test/verify-sync-gate-and-poll.cjs measures these four boxes in real
     Chromium. */
  .app {
    display: grid;
    grid-template-columns: var(--rail-w) 1fr;
    grid-template-rows: var(--header-h) auto 1fr;
    height: 100vh;
    height: 100dvh; /* iOS Safari: excludes collapsing browser chrome */
    overflow: hidden; /* shell never scrolls — only .work does */
  }
  /* The banner row. Matches App's <div role="status"> and nothing else —
     every other role="status" in the app is inside .work-inner, not a direct
     child of .app (the print block below already relies on the same fact). */
  .app > [role="status"] { grid-column: 1 / -1; grid-row: 2; }
  /* Generates no box of its own, so the empty host can never claim a grid
     cell the way the banner did. Its toasts are position:fixed and are
     unaffected by it. */
  #toast-host { display: contents; }
  /* The banner's Sync button. Inline-styled like the rest of the banner (see
     App), except for the one thing an inline style cannot express: it sits at
     the end of the row on a workstation, and becomes a full-width target on
     the line below the message on a phone — where it is the control someone
     reaches for one-handed, having just been told the numbers are stale. */
  .sync-banner-btn { flex: 0 0 auto; }
  .topbar {
    grid-column: 1 / -1;
    grid-row: 1;
    z-index: 30;
    display: flex; align-items: center; gap: 16px;
    padding: 0 max(18px, env(safe-area-inset-right, 0px))
             0 max(18px, env(safe-area-inset-left, 0px));
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 1px 0 oklch(93.6% 0.020 136 / .6), 0 1px 3px oklch(25% 0.02 205 / .03);
    position: sticky; top: 0; z-index: 30;
  }
  /* The app's own corner is the WORDMARK, not an icon tile (Praew,
     2026-09-22: "ส่วนบนซ้ายในหน้า dashboard ... ให้เอา NeoFeed ที่แก้แล้วนี้ไปใส่
     ไม่ต้องใส่ icon"). The tile the topbar used to draw is now only what it was
     always for — the home-screen and favicon artwork in icons/.
     The width still matches the rail, so the wordmark and the rail items share
     a left edge; the wordmark is shrink-to-fit inside it. */
  .brandmark {
    display: flex; align-items: center;
    width: calc(var(--rail-w) - 18px);
  }
  /* 1em is the N's height (see .nf-wordmark below): 26px, the size Praew
     picked from the rendered sheet on 2026-09-23 ("ขนาดจริงใน app ประมาณรูป 2"). */
  .brandmark .nf-wordmark { font-size: 26px; }

  .topbar .spacer { flex: 1; }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface-2);
    font-size: 12px;
    color: var(--ink-2);
  }
  .pill .dot { width: 7px; height: 7px; border-radius: 999px; background: var(--ok); }
  .pill.alert .dot { background: var(--crit); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }

  .icon-btn {
    width: 32px; height: 32px; border-radius: var(--r-sm);
    border: 1px solid var(--line); background: var(--surface);
    display: inline-grid; place-items: center; cursor: pointer;
    color: var(--ink-2);
  }
  .icon-btn:hover { background: var(--bg-2); color: var(--ink); }

  .user {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 10px 4px 4px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
  }
  .user .av {
    width: 26px; height: 26px; border-radius: 999px;
    background: var(--brand-bg-2); color: var(--brand-ink);
    display: grid; place-items: center; font-weight: 600; font-size: 11px;
  }
  .user .name { font-size: 12px; font-weight: 500; }
  .user .role { font-size: 10px; color: var(--ink-3); }

  /* ============ NAV RAIL ============ */
  .rail {
    grid-column: 1;
    grid-row: 3;
    background: var(--surface);
    border-right: 1px solid var(--line);
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: contain;
    padding: 14px 12px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .rail-section { font-size: 10px; font-weight: 600; color: var(--ink-3); letter-spacing: 0.08em; text-transform: uppercase; padding: 14px 8px 6px; }
  .rail-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px;
    border-radius: var(--r-sm);
    color: var(--ink-2);
    cursor: pointer;
    font-size: 13px;
    border: 1px solid transparent;
    user-select: none;
  }
  .rail-item { position: relative; transition: background .12s ease, color .12s ease, border-color .12s ease; }
  .rail-item:hover { background: var(--bg-2); color: var(--ink); }
  .rail-item.active {
    background: var(--brand-bg);
    color: var(--brand-ink);
    border-color: var(--brand-line);
    /* Deliberately NO font-weight change (it was 500 against an inactive
       400 until 2026-09-21). The extra weight pushed "Guidelines (ESPGHAN)"
       onto a second line at this rail width — measured 37px → 56px — so
       selecting a view reflowed the rail under the cursor that had just
       clicked it. State is carried by the indicator bar below, the Mineral
       Mist tint and the Midnight Teal ink, none of which touch the text
       metrics. Re-adding a weight here reintroduces the jump. */
  }
  /* Leading indicator — the one piece of chrome that says "you are here"
     without relying on the tint alone, which is the part that disappears
     first on a glare-washed bedside screen. */
  .rail-item.active::before {
    content: '';
    position: absolute; left: -1px; top: 50%; transform: translateY(-50%);
    width: 3px; height: 18px;
    border-radius: 0 3px 3px 0;
    background: var(--brand);
  }
  .rail-item svg { flex-shrink: 0; }
  .rail-item .count {
    margin-left: auto;
    font-size: 11px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    padding: 0 6px;
    border-radius: 999px;
    color: var(--ink-3);
  }
  .rail-item.active .count { background: #fff; border-color: var(--brand-line); color: var(--brand-ink); }
  .rail-item.crit .count { background: var(--crit-bg); border-color: var(--crit-line); color: var(--crit); }
  /* Cautions only — the badge wears the worst thing it counts (alarm fatigue,
     2026-09-24). Red is kept for an unacknowledged critical. */
  .rail-item.warn .count { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-ink); }

  .rail-foot {
    margin-top: auto; padding: 10px 8px; font-size: 11px; color: var(--ink-3);
    border-top: 1px solid var(--line-2);
  }
  .rail-foot .conn { display: flex; align-items: center; gap: 6px; }
  .rail-foot .conn .dot { width: 6px; height: 6px; background: var(--ok); border-radius: 999px; }

  /* ============ WORKSPACE ============ */
  .work { grid-column: 2; grid-row: 3; overflow: auto; overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; }
  .work-inner {
    padding: 18px max(22px, env(safe-area-inset-right, 0px))
             60px max(22px, env(safe-area-inset-left, 0px));
    max-width: 1480px;
  }
  /* The Ward page carries the quick-calc button (app.jsx showQuickFab), and
     its patient list scrolls under it: pad the end of the list clear of the
     button (24px inset + 48px button + a gap) so the last row's actions are
     never trapped beneath it. */
  .app.has-quick-fab .work-inner { padding-bottom: 108px; }

  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
  .page-head h1 {
    margin: 0; font-size: 20px; letter-spacing: -0.02em; font-weight: 600;
  }
  .page-head .sub { color: var(--ink-3); font-size: 13px; margin-top: 2px; }

  /* generic card */
  .card {
    background: var(--surface);
    border: 1.5px solid var(--frame);
    border-radius: var(--r);
    box-shadow: var(--shadow-card);
    transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
  }
  /* Card "lifts" when you're actively filling it in — no JS needed */
  .card:focus-within {
    border-color: var(--brand);
    box-shadow: var(--ring), 0 4px 12px oklch(25% 0.02 205 / .07);
  }
  .card-h {
    display: flex; align-items: center; gap: 10px;
    /* Pale blue fading to white, over a blue rule (Praew, 2026-09-22: "a
       pale-blue band, a blue frame and navy text ... แต่ให้มีเชรดขาวอ่อนๆ
       เหมือนที่เป็นสีเขียวไล่ขาวตอนนี้"). It was a whisper of Mineral Mist,
       which on the Porcelain-Mist ground left the header, the body and the
       page one wash; the band is what tells a card's title from its work. */
    background: linear-gradient(180deg, var(--frame-head) 0%, var(--surface) 100%);
    color: var(--frame-ink);
    padding: 14px 16px;
    border-bottom: 1.5px solid var(--frame-rule);
    font-weight: 600; font-size: 14px;
    letter-spacing: -0.01em;
  }
  .card > .card-h:first-child { border-radius: calc(var(--r) - 1px) calc(var(--r) - 1px) 0 0; }
  .card-h .h-meta { margin-left: auto; font-size: 11.5px; color: var(--ink-3); font-weight: 400; }
  .card-b { padding: 14px; }

  /* Ward gate tiles (registry.jsx WardTile): white on the page ground and
     framed like the cards (Praew, 2026-09-22: "ตรงกลาง ward ให้เป็นพื้นขาว
     เพื่อให้แยกจากกันได้ชัด"). Their inline style named a --bg-1 that never
     existed, so until this rule they had no fill at all. */
  .ward-tile {
    background: var(--surface);
    border: 1.5px solid var(--frame);
    box-shadow: var(--shadow-card);
    transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
  }
  .ward-tile:hover  { border-color: var(--brand); box-shadow: var(--shadow-pop); }
  .ward-tile:active { transform: translateY(1px); }

  /* ============ PATIENT HEADER STRIP ============ */
  .patient-strip {
    display: grid;
    grid-template-columns: minmax(200px, 1.5fr) minmax(0,1fr) minmax(0,2.4fr) minmax(0,1fr) minmax(0,1.4fr);
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r);
    box-shadow: var(--shadow-card);
    margin-bottom: 16px;
    overflow: hidden;
  }
  .patient-strip > div { padding: 10px 14px; border-right: 1px solid var(--line-2); display: flex; flex-direction: column; }
  .patient-strip > div:last-child { border-right: 0; }
  /* fixed-height label row → all .val lines align at the same vertical position */
  .patient-strip .lbl { font-size: 10px; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; height: 28px; display: flex; align-items: flex-end; padding-bottom: 2px; }
  .patient-strip .val { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; margin-top: 1px; line-height: 1.2; }
  .patient-strip .val.num { font-family: "IBM Plex Mono", monospace; font-weight: 500; }
  .patient-strip .sub { font-size: 11px; color: var(--ink-3); margin-top: 3px; font-weight: 500; }
  .patient-strip .lead {
    background: linear-gradient(165deg, var(--brand-bg-2) 0%, var(--brand-bg) 45%, #fff 95%);
    box-shadow: inset 3px 0 0 var(--brand);
  }
  .patient-strip .pid {
    display: flex; align-items: center; gap: 10px;
  }
  .patient-strip .pid .id { font-family: "IBM Plex Mono", monospace; font-size: 15px; font-weight: 600; }
  .patient-strip .pid .bed { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
  .patient-strip .switch {
    margin-top: 8px;
    font-size: 13px;
    color: var(--brand-ink);
    font-weight: 500;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
  }

  /* ============ LAYOUT for calculator page ============ */
  .calc-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr) minmax(360px, 0.95fr);
    gap: 14px;
  }
  @media (max-width: 1280px) {
    .calc-grid { grid-template-columns: 1fr 1fr; }
    .calc-grid .col-dash { grid-column: 1 / -1; }
  }
  /* Step 2 metric tiles: 5-col → 3+2 on narrow screens */
  @media (max-width: 1100px) {
    .metric-tiles-4 { grid-template-columns: repeat(3,1fr) !important; }
  }
  @media (max-width: 720px) {
    .metric-tiles-4 { grid-template-columns: 1fr 1fr !important; }
  }

  /* ============ INPUTS ============ */
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field > label {
    font-size: 12px; color: var(--ink-2); font-weight: 600;
    letter-spacing: 0.01em;
  }
  .field > label .unit { color: var(--ink-3); font-weight: 400; margin-left: 4px; }
  .inp, .sel {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid var(--line);
    background: var(--surface);
    border-radius: 8px;
    font-size: 14px;
    color: var(--ink);
    min-height: 44px;   /* touch-friendly tap target */
    transition: border-color .12s, box-shadow .12s, background .12s;
  }
  .inp:focus, .sel:focus {
    outline: none;
    border-color: var(--brand);
    box-shadow: var(--ring);
    background: oklch(99.4% 0.006 195);
  }
  .inp.num {
    font-family: "IBM Plex Mono", monospace;
    font-size: 18px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .inp-suffix {
    position: relative;
  }
  .inp-suffix .inp { padding-right: 36px; }
  .inp-suffix .suffix {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    font-size: 11px; color: var(--ink-3); pointer-events: none;
    font-family: "IBM Plex Mono", monospace;
  }

  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

  /* trend graph: compact x-axis seg (smaller than default .seg) */
  .trend-xaxis-seg { padding: 2px !important; border-width: 1px !important; }
  .trend-xaxis-seg button { padding: 6px 14px !important; font-size: 12px !important; min-height: 28px !important; border-radius: 6px !important; }
  .trend-xaxis-seg button:not(.on) { color: var(--ink-3); }

  /* trend graph: chip hover state (desktop) */
  .trend-chip:hover { transform: translateY(-1px); }

  /* segmented control */
  .seg {
    display: inline-flex; padding: 3px;
    border: 1.5px solid var(--line); border-radius: 8px;
    background: var(--bg-2); gap: 2px;
  }
  .seg button {
    border: 0; background: transparent; padding: 9px 16px;
    font-size: 13px; color: var(--ink-2);
    line-height: 1.2; white-space: nowrap;
    border-radius: 6px; cursor: pointer;
    transition: background .12s, color .12s;
    font-family: inherit;
  }
  .seg button:hover:not(.on) { background: var(--surface); color: var(--ink); }
  .seg button.on {
    background: var(--brand); color: #fff;
    box-shadow: 0 1px 4px oklch(38.5% 0.047 170 / .35);
    font-weight: 600;
  }

  /* sub-section header inside cards */
  .sub-h {
    font-size: 11px; font-weight: 600; color: var(--ink-3); letter-spacing: 0.08em; text-transform: uppercase;
    margin: 14px 0 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .sub-h:first-child { margin-top: 0; }
  .sub-h .badge {
    font-size: 10px; padding: 1px 6px; border-radius: 999px;
    background: var(--bg-2); border: 1px solid var(--line); color: var(--ink-3);
    font-weight: 500; letter-spacing: 0;
  }

  /* ============ DASHBOARD METRIC TILES ============ */
  .metric {
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 12px 14px;
    background: var(--surface);
    position: relative;
    overflow: hidden;
  }
  .metric .lbl {
    font-size: 11px; color: var(--ink-3); font-weight: 500; letter-spacing: 0.02em;
    display: flex; align-items: center; gap: 6px;
  }
  .metric .lbl .help {
    width: 14px; height: 14px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--ink-3);
    display: inline-grid; place-items: center; font-size: 9px; cursor: help;
  }
  .metric .val {
    font-family: "IBM Plex Mono", monospace;
    font-size: 30px; font-weight: 500;
    letter-spacing: -0.03em;
    line-height: 1.1;
    margin: 6px 0 2px;
  }
  .metric .val .u { font-size: 11px; color: var(--ink-3); margin-left: 4px; font-weight: 400; }
  .metric .target {
    font-size: 11px; color: var(--ink-3); display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .metric .target .range { font-family: "IBM Plex Mono", monospace; }

  /* status accent */
  .metric.s-ok    { border-color: var(--ok); background: linear-gradient(180deg, var(--ok-bg), var(--surface) 60%); }
  .metric.s-warn  { border-color: var(--warn); background: linear-gradient(180deg, var(--warn-bg), var(--surface) 60%); }
  .metric.s-crit  { border-color: var(--crit); background: linear-gradient(180deg, var(--crit-bg), var(--surface) 60%); }
  .metric.s-empty { opacity: .85; }
  .metric.s-brand { border-color: var(--brand); background: linear-gradient(180deg, var(--brand-bg), var(--surface) 60%); }
  .metric.s-brand .stripe { background: var(--brand); }

  .metric .stripe {
    position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  }
  .metric.s-ok    .stripe { background: var(--ok); }
  .metric.s-warn  .stripe { background: var(--warn); }
  .metric.s-crit  .stripe { background: var(--crit); }
  .metric.s-empty .stripe { background: var(--line); }

  /* range bar — one zone per status, laid out by calculator.jsx's
     meterZones from the tile's own grading function. The track clips the
     zones to its rounded ends; the needle sits outside it so it can stand
     proud of the bar, in ink with a white keyline, whatever zone it is on. */
  .meter {
    position: relative;
    height: 8px; margin: 9px 0 5px;
  }
  .meter .meter-track {
    position: absolute; inset: 0;
    background: var(--bg-2);
    border-radius: 999px;
    overflow: hidden;
  }
  .meter .zone { position: absolute; top: 0; bottom: 0; }
  .meter .z-ok   { background: var(--zone-ok); }
  .meter .z-warn { background: var(--zone-warn); }
  .meter .z-crit { background: var(--zone-crit); }
  .meter .z-best { background: var(--zone-best); }
  .meter .needle {
    position: absolute; top: -5px;
    width: 4px; height: 18px;
    border-radius: 2px;
    background: var(--ink);
    box-shadow: 0 0 0 2px var(--surface);
    transform: translateX(-50%);
  }

  /* ============ ALERTS ============ */
  .alert-row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 12px;
    border-radius: var(--r-sm);
    border: 1px solid var(--line);
    background: var(--surface);
    font-size: 12.5px;
  }
  .alert-row + .alert-row { margin-top: 6px; }
  .alert-row .ico {
    width: 22px; height: 22px; border-radius: 999px;
    display: grid; place-items: center; flex-shrink: 0;
    font-size: 12px; font-weight: 600;
  }
  .alert-row.crit { border-color: var(--crit-line); background: var(--crit-bg); }
  .alert-row.crit .ico { background: var(--crit); color: #fff; }
  .alert-row.crit .title { color: var(--crit-ink); }
  .alert-row.warn { border-color: var(--warn-line); background: var(--warn-bg); }
  .alert-row.warn .ico { background: var(--warn); color: #fff; }
  .alert-row.warn .title { color: var(--warn-ink); }
  .alert-row.info { border-color: var(--brand-line); background: var(--brand-bg); }
  .alert-row.info .ico { background: var(--brand); color: #fff; }
  .alert-row.info .title { color: var(--brand-ink); }
  .alert-row .title { font-weight: 600; }
  .alert-row .body { color: var(--ink-2); margin-top: 1px; }
  .alert-row .meta { color: var(--ink-3); font-size: 11px; margin-top: 4px; font-family: "IBM Plex Mono", monospace; }

  /* ============ BUTTONS ============ */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 16px;
    border-radius: 8px;
    border: 1.5px solid var(--line);
    background: var(--surface);
    cursor: pointer; font-size: 13.5px; color: var(--ink);
    font-family: inherit; font-weight: 500;
    transition: background .12s, border-color .12s, box-shadow .12s, transform .1s;
    min-height: 40px;
  }
  .btn:hover { background: var(--bg-2); border-color: oklch(82.4% 0.039 139); }
  .btn:active { transform: scale(0.98); }
  .btn.primary {
    background: var(--brand); color: #fff; border-color: var(--brand-2);
    box-shadow: 0 2px 0 oklch(29% 0.042 170 / .45), 0 4px 12px oklch(38.5% 0.047 170 / .22);
  }
  .btn.primary:hover { background: var(--brand-2); box-shadow: 0 2px 0 oklch(26.8% 0.030 170 / .5), 0 6px 18px oklch(38.5% 0.047 170 / .32); }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.ghost:hover { background: var(--bg-2); }
  .btn.sm { padding: 5px 10px; font-size: 12px; min-height: 32px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; transform: none; }
  .btn:disabled:hover { background: var(--surface); border-color: var(--line); }
  .btn.primary:disabled:hover { background: var(--brand); }

  /* ============ PRESET CHIPS ============ */
  /* Quick-fill value chips — tap to populate the field instantly */
  .preset-chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }
  .preset-chip {
    padding: 4px 12px; border-radius: 999px; font-size: 12px;
    cursor: pointer; border: 1.5px solid var(--line-2);
    background: var(--bg-2); color: var(--ink-3);
    font-family: "IBM Plex Mono", monospace; font-weight: 500;
    transition: all .1s; line-height: 1.2;
  }
  .preset-chip:hover  { border-color: var(--brand); color: var(--brand-ink); background: var(--brand-bg); }
  .preset-chip:active { transform: scale(0.95); }
  .preset-chip.active { background: var(--brand-bg); border-color: var(--brand); color: var(--brand-ink); font-weight: 700; }

  /* ============ ACCORDION STEP CARDS ============ */
  .card-h.clickable { cursor: pointer; user-select: none; }
  .card-h.clickable { transition: background 0.12s ease; }
  .card-h.clickable:hover  { background: var(--frame-head-2); }
  .card-h.clickable:active { background: var(--frame-head-2); }
  .step-summary {
    flex: 1; margin-left: 8px; display: flex; align-items: center; gap: 6px;
    flex-wrap: wrap; overflow: hidden;
  }
  .step-summary-chip {
    font-family: "IBM Plex Mono", monospace; font-size: 11px;
    color: var(--ink-2); background: var(--bg-2);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 1px 7px; white-space: nowrap;
  }
  .step-dot {
    width: 9px; height: 9px; border-radius: 999px; flex-shrink: 0;
    transition: background .2s;
  }
  .step-dot.done    { background: var(--ok); box-shadow: 0 0 0 2px oklch(52% 0.12 155 / .2); }
  .step-dot.partial { background: var(--warn); }
  .step-dot.empty   { background: var(--line); border: 1.5px solid var(--line-2); }

  /* ============ TABLES ============ */
  table.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.tbl th, table.tbl td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line-2); }
  table.tbl th {
    font-size: 10.5px; color: var(--brand-ink); font-weight: 600;
    letter-spacing: 0.05em; text-transform: uppercase;
    background: var(--brand-bg);
    border-bottom: 1px solid var(--brand-line);
  }
  table.tbl tr:hover td { background: var(--bg-2); }
  table.tbl td.num { font-family: "IBM Plex Mono", monospace; }

  /* status chip */
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; padding: 3px 9px;
    border-radius: 999px; white-space: nowrap;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink-2);
    font-weight: 500;
  }
  .chip .d { display: none; }
  .chip.ok   { color: var(--ok-ink); border-color: var(--ok-line); background: var(--ok-bg); }
  .chip.ok .d { background: var(--ok); }
  .chip.warn { color: var(--warn-ink); border-color: var(--warn-line); background: var(--warn-bg); }
  .chip.warn .d { background: var(--warn); }
  .chip.crit { color: var(--crit-ink); border-color: var(--crit-line); background: var(--crit-bg); }
  .chip.crit .d { background: var(--crit); }
  .chip.brand { color: var(--brand-ink); border-color: var(--brand-line); background: var(--brand-bg); }
  .chip.brand .d { background: var(--brand); }

  /* ============ PATIENT PICKER (modal-style) ============ */
  .picker-backdrop {
    position: fixed; inset: 0; background: oklch(24% 0.022 205 / .38);
    z-index: 50; display: grid; place-items: center;
    backdrop-filter: blur(2px);
  }
  .picker {
    width: min(720px, 92%); max-height: 80vh; max-height: 80dvh; overflow: auto;
    background: var(--surface); border-radius: var(--r-lg);
    box-shadow: var(--shadow-lift); border: 1px solid var(--line);
  }
  .picker-h {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 18px; border-bottom: 1px solid var(--line-2);
  }
  .picker-h input {
    flex: 1; border: 0; outline: 0; font-size: 14px; background: transparent;
  }

  /* ============ MODAL (generic form dialog — e.g. change password) ============ */
  /* Same overlay pattern as .picker-backdrop/.picker above, sized for a form
     instead of a search list, with head/body/foot sections. */
  .modal-backdrop {
    position: fixed; inset: 0; background: oklch(24% 0.022 205 / .38);
    z-index: 60; display: grid; place-items: center;
    backdrop-filter: blur(2px);
  }
  .modal-box {
    width: min(420px, 92%);
    background: var(--surface); border-radius: var(--r-lg);
    box-shadow: var(--shadow-lift); border: 1px solid var(--line);
  }
  .modal-head {
    padding: 16px 18px 12px; border-bottom: 1px solid var(--line-2);
  }
  .modal-head h2 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.01em; color: var(--ink); }
  .modal-body { padding: 16px 18px; }
  .modal-foot {
    display: flex; justify-content: flex-end; gap: 8px;
    padding: 12px 18px 16px; border-top: 1px solid var(--line-2);
  }

  /* ============ DISCLAIMER ============ */
  .disclaimer-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px;
    background: var(--warn-bg);
    border: 1px solid var(--warn-line);
    color: var(--warn-ink);
    border-radius: var(--r-sm);
    font-size: 12px;
    margin-bottom: 14px;
  }

  /* FENTON */
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
  .legend .s { display: inline-flex; align-items: center; gap: 6px; }
  .legend .s .b { width: 18px; height: 3px; border-radius: 2px; }

  /* small kbd-style */
  .kbd { font-family: "IBM Plex Mono", monospace; font-size: 11px; padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface-2); color: var(--ink-2); }

  /* switch-patient — top-bar quick picker */
  .switch-patient {
    display: inline-flex; align-items: center; gap: 10px;
    height: 36px; padding: 0 10px 0 8px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; cursor: pointer;
    transition: border-color .12s ease, background .12s ease, box-shadow .12s ease;
  }
  .switch-patient:hover { border-color: var(--brand); background: var(--brand-bg); box-shadow: 0 1px 2px oklch(25% 0.02 205 / .06); }
  .switch-patient .sp-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 6px; background: var(--bg-2);
  }
  .switch-patient .sp-label { font-size: 13px; color: var(--ink); font-weight: 500; letter-spacing: -.01em; }
  .switch-patient .sp-kbd {
    font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--ink-3);
    padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg-2);
  }


  /* scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: oklch(88% 0.010 198); border-radius: 999px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: oklch(78% 0.016 200); }

  /* sparkline */
  .spark { stroke: var(--brand-3); stroke-width: 1.5; fill: none; }
  .spark-pt { fill: var(--brand); }

  /* mini progress to percentile */
  .pct-band { display: inline-flex; align-items: center; gap: 4px; }
  .pct-band .bb { width: 36px; height: 6px; background: var(--bg-2); border-radius: 999px; overflow: hidden; position: relative; }
  .pct-band .bb i {
    position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px;
    background: linear-gradient(90deg, var(--brand) 0%, var(--brand-3) 100%);
  }

  /* ============ LOADING SPINNER (sync dot) ============ */
  @keyframes spin { to { transform: rotate(360deg); } }
  .dot-spin {
    display: inline-block;
    border: 1.5px solid oklch(88% 0.06 65 / .5);
    border-top-color: var(--warn);
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
    background: transparent !important;
  }

  /* ============ ACCORDION TRANSITION ============ */
  /* An open step is as tall as its content: there is no height to outgrow.
     Until 2026-09-25 the open state was `max-height: 1800px`, a number meant
     to be "taller than any step". On a phone the two-column steps stack, and
     Step 3 measured 1943px at 360px wide, so its last 143px (the Lipid and
     NPC : Protein tiles) were clipped with nothing to scroll to (Pp, from an
     Android phone: "เลื่อนแล้วไม่เต็มช่อง"). The one grid row slides from 0fr
     to 1fr, which is the content's own height, so the animation stays and
     the cap goes. `.accordion-inner` (StepBody in calculator.jsx) is the one
     grid item: min-height: 0 lets the row close to nothing, and its
     overflow: hidden clips only while the row is sliding. */
  .accordion-body {
    display: grid;
    grid-template-rows: 0fr;
    grid-template-columns: minmax(0, 1fr);
    visibility: hidden;
    transition: grid-template-rows 0.28s cubic-bezier(0.4, 0, 0.2, 1),
                visibility 0s linear 0.28s;
  }
  .accordion-body.open {
    grid-template-rows: 1fr;
    visibility: visible;
    transition: grid-template-rows 0.32s cubic-bezier(0.4, 0, 0.2, 1),
                visibility 0s linear 0s;
  }
  .accordion-inner { min-height: 0; overflow: hidden; }

  /* ============ BOTTOM NAV (mobile) ============ */
  .bottom-nav { display: none; }

  /* ============ QUICK-CALC FLOATING BUTTON ============ */
  /* Bottom-right on every screen size (ward request 2026-09-21). A direct
     child of .app, NOT of the grid's content rows — it is position:fixed, so
     it takes no grid cell and cannot repeat the banner's auto-placement bug
     that collapsed the workspace (see the .app comment above).
     z-index sits below .bottom-nav's 40 deliberately: the two never overlap
     (the mobile rules below park it clear of the nav), and if a future layout
     change ever makes them, the navigation wins rather than a shortcut. */
  .quick-fab {
    position: fixed;
    right: max(24px, env(safe-area-inset-right, 0px));
    bottom: 24px;
    z-index: 35;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    height: 48px;
    padding: 0 20px 0 17px;
    border: none;
    border-radius: 999px;
    background: var(--brand);
    color: #fff;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: -0.01em;
    cursor: pointer;
    /* --shadow-lift, the palette's "floating above the page" shadow (the same
       one the modals and the picker use), not a hand-rolled oklch: PR #81
       moved every shadow onto hue 205 and gave the design system one
       definition, and this button was written against the old 230 before that
       merge. Kept on the token so the next palette move carries it too. */
    box-shadow: var(--shadow-lift);
    transition: transform .12s ease, background .12s ease;
  }
  .quick-fab:hover { background: var(--brand-2); }
  .quick-fab:active { transform: translateY(1px); }
  .quick-fab:focus-visible { outline: 2px solid var(--brand-2); outline-offset: 3px; }
  .quick-fab svg { flex: 0 0 auto; }

  /* The DOL box in the quick calc's page head. */
  .quick-dol { display: flex; align-items: center; gap: 8px; }
  .quick-dol label { font-size: 11px; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--ink-3); }
  .quick-dol input {
    width: 76px; height: 40px; padding: 0 10px; text-align: center;
    font-size: 15px; font-weight: 600; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm);
  }
  .quick-dol input:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }

  /* ============ LOGIN SCREEN ============ */
  /* The one screen that is pure brand: the app's own ground with the NeoFeed
     logo as the hero. The logo is the 2026-09-23 lockup Praew chose from
     rendered sheets: the N (a swaddled baby: the circle is the head, the dark
     ribbon the cloth, the light stem the body), "eo" and "Feed" with a bottle
     and a milk drop in Feed's e's, and a green / Champagne Gold rule, every
     letter's corners rounded like the N's. "by Valhalla Health" stays at the
     foot of the screen, not in the logo. icons/logo.svg is its master and
     icons/icon.svg the app icon's; <NeoFeedWordmark/> in app.jsx draws the
     same paths. */
  .login-wrap {
    /* ── Luminous Protection, on this screen only ─────────────────────
       Praew, 2026-09-22, after the app went back to the teal sheet: "ขอกลับ
       ไปใช้ NeoFeed และหน้า login เดิม สีนี้" — the login screen keeps the
       green brand-board palette it was designed in, and so does the mark.
       The app's own chrome is teal; the two are allowed to differ, because
       this screen is the brand and the workspace is the tool.

       Custom properties inherit, so re-declaring the seven tokens this
       screen actually consumes pins the whole login tree to the board while
       :root stays teal — no .login-* rule has to name a literal, and none of
       them drifts when either palette next moves. The other tokens it reads
       (--ring, --shadow-lift, --r-xl and every clinical status colour) are
       byte-identical in both sheets, so they are deliberately absent rather
       than duplicated. The wordmark takes none of these: its colours are
       literals, in .nf-wordmark above.
       Delete this block to put the login screen back on the app's palette.

       --bg IS NOT HERE ON PURPOSE (Praew, 2026-09-22, choosing variant C from
       three rendered side by side): the login screen takes the app's own
       ground, Porcelain Mist, so opening the app is not a step between two
       products. It follows :root from now on — if the app's ground moves, this
       screen moves with it, which is the point.
       What stays below is what this screen still needs that the app does not:
       the board's Celadon hairline and its two green-leaning ink tiers.
       --brand happens to match :root today (the app's accent moved onto the
       mark) and is kept as the insurance it was written to be.
       --brand-4 and --sand (Sage and Champagne Gold) left on 2026-09-23: their
       one consumer was the CSS rule under the old wordmark, and that rule is
       now part of the logo drawing, in the logo's own literal colours. */
    --brand:   oklch(38.5% 0.047 170);   /* Forest         #284C40 */
    --line:    oklch(87.6% 0.031 148);   /* Celadon        #C9DCCB */
    --ink-2:   oklch(41.5% 0.028 170);
    --ink-3:   oklch(51.7% 0.022 170);

    position: fixed; inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    /* Centred by auto margins (the first child's margin-top, the footer's
       below), not justify-content: center. Centring with justify-content
       pushes content that does not fit past the TOP of the scroll area as
       well as the bottom, where it can never be scrolled back to; auto
       margins centre the column when it fits and fall to 0 when it does not,
       so a landscape phone scrolls from the top of the logo down to the
       footer (2026-09-25 phone sweep). */
    justify-content: flex-start;
    text-align: center;
    background: var(--bg);
    /* Safe areas on all four sides: the shell sets viewport-fit=cover, so
       without these the wordmark runs under the notch in landscape and the
       footer under the home indicator. max() keeps the design padding on
       every device that has no inset. */
    padding: 40px max(24px, env(safe-area-inset-right, 0px))
             calc(28px + env(safe-area-inset-bottom, 0px))
             max(24px, env(safe-area-inset-left, 0px));
    gap: 0;
    /* Explicit on BOTH axes. `overflow-y: auto` alone leaves overflow-x
       computing to `auto` (a visible/non-visible pair is not allowed), which
       is what let the ::before bleed become a sideways drag. Nothing on this
       screen is ever meant to scroll horizontally. */
    overflow-x: hidden;
    overflow-y: auto;
    isolation: isolate;
  }
  /* NO RIBBONS. Three soft ellipses used to wash this screen in Sage, Pale
     Jade and one breath of Champagne Gold. They went with the Ivory ground on
     2026-09-22 (variant C): with the app's own Porcelain Mist underneath, the
     wash read as a second colour rather than as depth, and the point of the
     change was for the two screens to share one ground.

     If a decorative full-bleed layer ever comes back here, it must be
     `position: fixed`, NOT absolute. An absolutely-positioned bleed inside a
     scroll container IS scrollable overflow on the right and bottom edges,
     and that is exactly how this screen gained 39px of sideways drag and 85px
     of vertical drag over nothing at all on a 390px phone. The overflow rule
     below and test/verify-mobile-fit.cjs § 1 both still guard it. */

  /* ── The wordmark, in one place ──────────────────────────────────
     <NeoFeedWordmark/> (app.jsx) draws the 2026-09-23 logo as one inline
     <svg class="nf-mark">, every letter a path, and THREE screens call it:
     the login hero (the full lockup), the topbar corner and the sync gate.
     1em is the N's height. The drawing is 456 units wide for an N of 100, so
     it is 4.56em wide at every call site and its height follows its own
     viewBox; a call site sets font-size and nothing else. No colour here:
     the mark paints its own literals, because a logo is not a UI colour and
     no token may carry it off on the next palette move. */
  .nf-wordmark { line-height: 0; }
  .nf-wordmark .nf-mark { display: block; width: 4.56em; max-width: 100%; height: auto; }

  /* The login hero is the whole lockup at an N of 72px, 328px wide. The rule
     is part of the drawing, so the CSS rule that used to hang under the
     wordmark is gone. max-width lets it shrink on a phone narrower than it
     is. */
  .login-app-name {
    font-size: 72px;
    max-width: 100%;
    margin-bottom: 22px;
  }

  .login-tagline {
    font-size: 16px;
    color: var(--ink-3);
    line-height: 1.65;
    font-weight: 400;
    margin-bottom: 40px;
  }

  .login-btn-area {
    width: 100%;
    max-width: 320px;
    position: relative;
    min-height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 0;
  }

  .login-error {
    width: 100%; max-width: 320px;
    padding: 11px 14px;
    background: var(--crit-bg);
    border: 1px solid var(--crit-line);
    border-radius: 10px;
    color: var(--crit-ink);
    font-size: 13px;
    margin-top: 14px;
  }

  .login-alt-link {
    margin-top: 18px;
    font-size: 13px;
    color: var(--ink-3);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    padding: 4px 8px;
    border-radius: 6px;
    transition: color .15s;
  }
  .login-alt-link:hover { color: var(--brand); }
  .login-alt-link:focus-visible { outline: none; box-shadow: var(--ring); color: var(--brand); }

  .login-back-link {
    display: flex; align-items: center; gap: 5px;
    font-size: 12.5px; color: var(--ink-3);
    background: none; border: none; cursor: pointer;
    margin-bottom: 18px; padding: 2px 4px;
    border-radius: 6px; transition: color .15s;
    align-self: flex-start;
  }
  .login-back-link:hover { color: var(--brand); }
  .login-back-link:focus-visible { outline: none; box-shadow: var(--ring); color: var(--brand); }

  /* The email/password form sits on a card, so the fields read as a surface
     over the ribbons instead of floating on them. */
  .login-form-wrap {
    width: 100%; max-width: 340px;
    display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
    padding: 20px;
    background: oklch(100% 0 0 / .82);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid oklch(100% 0 0 / .9);
    border-radius: var(--r-xl);
    box-shadow: var(--shadow-lift);
  }

  .login-wrap > :first-child { margin-top: auto; }
  /* The footer is in the column's flow, last, pushed down by its auto margin.
     It used to be `position: absolute; bottom: 28px` over a padding reserved
     for it — which holds only while the column fits. On a landscape phone
     (844×390) it landed on the form, and its text took the tap meant for
     เข้าสู่ระบบ: nobody could sign in with the phone turned sideways. */
  .login-contact {
    margin-top: auto;
    padding-top: 28px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  /* The endorsement, replacing the "ติดต่อทีม Valhalla" button removed on
     2026-09-22. Brand Handbook § 07: the endorsement sits under the product
     and never outranks it — so this is 12px under the logo, in the quiet ink
     tier, with no border and no button affordance. It is a signature, not a
     call to action: one line, "by Valhalla Health · © 2026". The 2026-09-23
     logo carried "by VALHALLA HEALTH" for one round; Praew put it back here,
     so it is shown once. */
  .login-endorse {
    font-size: 12px;
    letter-spacing: 0.02em;
    color: var(--ink-3);
  }

  @media (max-width: 767px) {
    .login-app-name  { font-size: 64px; margin-bottom: 18px; }
    .login-tagline   { font-size: 15px; margin-bottom: 32px; }
  }


  /* trend graph: vertical dividers between Latest / Target / Δ stats (desktop) */
  .trend-latest > div { position: relative; padding-right: 28px; }
  .trend-latest > div:not(:last-child)::after {
    content: ""; position: absolute; right: 0; top: 4px; bottom: 4px;
    width: 1px; background: var(--line-2);
  }
  .trend-latest > div:last-child { padding-right: 0; }

  /* ============ PATIENT REGISTRY ============ */
  .patient-card-list { display: none; }
  .patient-table     { display: block; }
  /* A table wider than the workspace scrolls inside its own card, never the
     page. From 768px up the ward list is this table, whose columns need about
     850px: on a landscape phone or an iPad it ran up to 159px past the
     workspace, and the whole screen dragged sideways to reach Edit and Open.
     The Dashboard's entries did the same (log.jsx .tbl-scroll). 2026-09-25
     phone sweep; the app must not scroll sideways at any width. */
  .patient-table, .tbl-scroll { overflow-x: auto; }

  .reg-stats { display: flex; gap: 8px; margin-bottom: 16px; }
  .reg-stat {
    flex: 1; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); padding: 10px 14px 10px 16px;
    display: flex; flex-direction: row; align-items: center; gap: 12px;
    box-shadow: var(--shadow-card); border-left: 3px solid var(--line);
  }
  .reg-stat-val {
    font-family: "IBM Plex Mono", monospace; font-size: 24px; font-weight: 600;
    letter-spacing: -0.03em; line-height: 1; color: var(--ink); flex-shrink: 0;
  }
  .reg-stat-lbl { font-size: 11px; color: var(--ink-3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; line-height: 1.3; }
  .reg-stat.s-ok    { border-left-color: var(--ok); }
  .reg-stat.s-warn  { border-left-color: var(--warn); }
  .reg-stat.s-crit  { border-left-color: var(--crit); }
  .reg-stat.s-brand { border-left-color: var(--brand); }

  /* Per-patient "has today's Daily_Log entry?" badge — registry cards + table.
     Same vocabulary as the Logged today / Needs entry tiles above the list, so
     the strip and the rows can never appear to disagree. */
  .log-badge {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 2px 7px; border-radius: 999px; flex-shrink: 0;
    /* Explicit UI font: the mobile card puts this badge inside .pmc-stats,
       which is monospace — the badge should read like the stats-strip labels
       it mirrors, not like the numbers beside it. */
    font-family: "IBM Plex Sans", "IBM Plex Sans Thai", "Sarabun", system-ui, sans-serif;
    font-size: 10px; font-weight: 700; letter-spacing: 0.05em; white-space: nowrap;
    color: var(--crit-ink); background: var(--crit-bg); border: 1px solid var(--crit-line);
  }
  .log-badge.is-logged {
    color: var(--ok-ink); background: var(--ok-bg); border-color: var(--ok-line);
  }
  /* Today's order saved as a draft — not yet Submitted, so not "logged". */
  .log-badge.is-draft {
    color: var(--warn-ink); background: var(--warn-bg); border-color: var(--warn-line);
  }
  .reg-stat.s-ok   .reg-stat-val { color: var(--ok); }
  .reg-stat.s-warn .reg-stat-val { color: var(--warn-ink); }
  .reg-stat.s-crit .reg-stat-val { color: var(--crit); }
  .reg-stat.s-brand .reg-stat-val { color: var(--brand-ink); }

  .reg-filter { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
  .reg-filter .reg-search { position: relative; flex: 1; max-width: 400px; }
  .reg-filter .reg-search .inp { padding-left: 36px; padding-right: 40px; height: 38px; }
  .reg-filter .reg-search .s-ico { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
  /* Clear (×), inside the box's right edge. 32px here; 44px on touch below. */
  .reg-filter .reg-search .s-clear {
    position: absolute; right: 3px; top: 50%; transform: translateY(-50%);
    width: 32px; height: 32px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    border: 0; border-radius: 999px; background: transparent; color: var(--ink-3); cursor: pointer;
  }
  .reg-filter .reg-search .s-clear:hover { background: var(--bg-2); color: var(--ink); }
  .reg-search-note { font-size: 11.5px; color: var(--ink-3); margin: -4px 0 10px; }
  .search-miss { line-height: 1.5; }

  /* ── Patient name: ชื่อ + นามสกุล (registry.jsx NameFields) ── */
  /* Two boxes of two characters each, side by side at every width — .row-2
     stacks on a phone, which would spend a whole row on each two-letter box. */
  .row-2.pair-row { grid-template-columns: 1fr 1fr; }
  .name-fields { display: flex; flex-direction: column; gap: 6px; }
  .name-note { font-size: 11px; color: var(--warn-ink); line-height: 1.4; }
  .name-rule { font-size: 11px; color: var(--ink-3); line-height: 1.4; }
  .name-foreign {
    display: inline-flex; align-items: center; gap: 8px; align-self: flex-start;
    font-size: 12.5px; color: var(--ink-2); cursor: pointer;
  }
  .name-foreign input { width: 18px; height: 18px; margin: 0; accent-color: var(--brand); }

  .patient-table table.tbl td { vertical-align: middle; padding-top: 9px; padding-bottom: 9px; }
  .patient-table table.tbl tr.p-active td { background: var(--brand-bg); }
  .patient-table table.tbl tr:hover td { background: var(--bg-2); }
  .patient-table table.tbl tr.p-active:hover td { background: var(--brand-bg-2); }

  /* ============ MOBILE / DESKTOP TABLE SWAP ============ */

  /* ============ TABLET: 768–1199px — icon-only rail ============ */
  @media (min-width: 768px) and (max-width: 1199px) {
    :root { --rail-w: 60px; }
    /* overflow-y stays auto (the base rule's): `overflow: hidden` here cut
       the rail's lower items off on a landscape phone (915×412, eight items
       in 356px) with nothing to scroll to — 2026-09-25 phone sweep. */
    .rail { padding: 10px 8px; overflow-x: hidden; overflow-y: auto; }
    .rail-section { display: none; }
    .rail-foot { display: none; }
    /* The rail collapses to icons here, but the brandmark cannot: with the
       tile gone there is nothing left to show if the wordmark is hidden, and
       42px does not fit it. It sizes to its content instead — the topbar is
       full width, so the only thing lost is the rail-edge alignment. */
    .brandmark { width: auto; }
    .rail-item { justify-content: center; padding: 10px 0; gap: 0; }
    .rail-item > span:not([class]) { display: none; }
    .rail-item .count { display: none; }
    .switch-patient .sp-label { display: none; }
    .switch-patient .sp-kbd  { display: none; }
    .switch-patient { padding: 0 8px; min-width: 36px; }
    .calc-grid { grid-template-columns: 1fr 1fr !important; }
    .work-inner {
      padding: 14px max(14px, env(safe-area-inset-right, 0px))
               40px max(14px, env(safe-area-inset-left, 0px));
    }
  }

  /* ============ TOUCH DEVICES OF ANY WIDTH ============ */
  /* The ≤767px block below carries the phone-sized 44px minimums. A tablet
     (iPad at 768px+ is a NICU-plausible device) never matches it, so it kept
     the desktop's ~25px chips and 36px switcher on a touch screen. Keying off
     the input device rather than the width covers that without touching
     mouse-driven desktop at the same width. */
  @media (hover: none) and (pointer: coarse) and (min-width: 768px) {
    .btn        { min-height: 44px; min-width: 44px; }
    .btn.sm     { min-height: 44px; }
    .seg button { min-height: 44px; min-width: 44px; }
    .trend-xaxis-seg button { min-height: 44px !important; }
    .trend-chips > button   { min-height: 44px; }
    .switch-patient   { min-height: 44px; min-width: 44px; }
    .card-h.clickable { min-height: 44px; }
    /* Collapsed tablet rail is 60px wide with 8px side padding, leaving the
       item 43px — trim the padding by 1px so a full 44px fits inside it. */
    .rail { padding-left: 7px; padding-right: 7px; }
    .rail-item        { min-height: 44px; min-width: 44px; }
    .bnav-item        { min-height: 44px; }
    .preset-chips { flex-wrap: wrap; }
    .preset-chip {
      min-height: 44px; min-width: 44px; flex: 1 1 44px;
      display: flex; align-items: center; justify-content: center;
    }
    .patient-mc .pmc-actions .btn { min-height: 44px; }
    .reg-filter .reg-search .s-clear { width: 44px; height: 44px; right: 0; }
    .reg-filter .reg-search .inp { padding-right: 46px; }
    .name-foreign { min-height: 44px; }
  }

  /* ============ MOBILE: ≤767px ============ */
  @media (max-width: 767px) {
    :root { --rail-w: 0px; --header-h: 52px; }

    /* Shell: 1-column, no rail. The banner row stays (see .app above) — the
       workspace has to be told to sit in the single remaining column, since
       the desktop rule puts it in column 2. */
    .app {
      grid-template-columns: 1fr;
      grid-template-rows: var(--header-h) auto 1fr;
    }
    .work { grid-column: 1; }
    .rail { display: none; }
    .sync-banner-btn { flex: 1 0 100%; }

    /* Topbar: compact */
    .topbar {
      padding: 0 max(12px, env(safe-area-inset-right, 0px))
               0 max(12px, env(safe-area-inset-left, 0px));
      gap: 8px;
    }
    .brandmark { width: auto; }
    .topbar .pill { display: none; }
    .topbar .icon-btn { display: none; }
    .switch-patient .sp-label { display: none; }
    .switch-patient .sp-kbd  { display: none; }
    .switch-patient { padding: 0 8px; min-width: 36px; }
    /* User chip: avatar only */
    .user .name { display: none; }
    .user .role { display: none; }
    .user { padding: 3px; border-radius: 999px; }

    /* Work area: pad bottom for tab bar + iOS home indicator */
    .work-inner {
      padding: 10px max(12px, env(safe-area-inset-right, 0px))
               calc(68px + env(safe-area-inset-bottom, 0px))
               max(12px, env(safe-area-inset-left, 0px));
    }
    /* …and on the Ward page, for the quick-calc button parked above the
       nav (58px nav + inset + 14px + its 46px + a gap). */
    .app.has-quick-fab .work-inner {
      padding-bottom: calc(136px + env(safe-area-inset-bottom, 0px));
    }

    /* Patient strip: 2×3 grid. minmax(0, 1fr), not 1fr: a bare 1fr column
       cannot shrink below its content, so one wide cell pushed the grid past
       the strip's clipped edge on a phone (2026-09-25 phone sweep). */
    .patient-strip {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    }
    .patient-strip > div {
      border-right: none;
      border-bottom: 1px solid var(--line-2);
    }
    .patient-strip > div:nth-child(odd) {
      border-right: 1px solid var(--line-2);
    }
    .patient-strip > div:nth-child(4),
    .patient-strip > div:nth-child(5) {
      border-bottom: none;
    }
    .patient-strip .val { font-size: 14px; }
    .patient-strip .lbl { height: 22px; font-size: 9px; }

    /* Layout: single column everywhere */
    .calc-grid { grid-template-columns: 1fr !important; }
    .row-2 { grid-template-columns: 1fr; }
    .row-3 { grid-template-columns: 1fr 1fr; }

    /* Page head: stack */
    .page-head {
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 10px;
    }
    .page-head h1 { font-size: 17px; }
    /* `+ div` (not :last-child) so this only matches a second/actions div —
       a lone title div is both first and last child and must stay block. */
    .page-head > div + div { display: flex; gap: 6px; width: 100%; }
    .page-head > div + div .btn { flex: 1; justify-content: center; font-size: 13px; }

    /* Metric tiles: 2 col. Every calculator grid below is minmax(0, 1fr),
       not a bare 1fr, which cannot shrink below its content: on a 280px or
       320px phone, or a phone with large text, bare-1fr columns pushed their
       content past a clipped edge (2026-09-25 phone sweep). */
    .metric-tiles-4 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) !important; }
    .metric .val { font-size: 24px; }

    /* Fenton growth chart: chart above stats instead of squeezed beside a fixed 200px column */
    .fenton-grid { grid-template-columns: 1fr !important; }

    /* Tables: let card scroll */
    .card { overflow-x: auto; }

    /* ── Calculator: fix all inner grids ── */
    /* TwoCol (Steps 3/4/5): inputs+tiles → stack vertically */
    .two-col { grid-template-columns: minmax(0, 1fr) !important; }
    /* Step 1: 5-col inputs → 2-col */
    .s1-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) !important; }
    /* Step 2 sub-rows: 3-col → 2-col */
    .s2-aa-row  { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) !important; }
    .s2-lip-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) !important; }
    /* Bottom (energy+alerts+save): 3-col → 1-col */
    .calc-bottom { grid-template-columns: 1fr !important; }
    /* SaltRow: 1.6fr 1fr 90px → 1fr 80px (hide = total col, shown in readout below) */
    .salt-row-grid { grid-template-columns: minmax(0, 1fr) 80px !important; gap: 6px !important; }
    .salt-row-grid > div:nth-child(3) { display: none !important; }
    /* Step 2 card-h: wrap route+Osm to new line */
    .step2-card-h { flex-wrap: wrap; padding: 10px 12px; gap: 6px; }
    .step2-ctrl { width: 100%; margin-left: 0 !important; order: 10; }
    .step2-ctrl .seg button { font-size: 11px; padding: 6px 10px; }
    /* Growth chart card-h: wrap Weight/Length/HC picker to its own row instead
       of overlapping the "Fenton 2025 growth chart · Male" title */
    .fenton-card-h { flex-wrap: wrap; padding: 10px 12px; gap: 6px; }
    .fenton-ctrl { width: 100%; margin-left: 0 !important; }

    /* Picker → bottom sheet */
    .picker {
      /* 100% of the fixed, inset:0 backdrop — never 100vw, which counts a
         classic scrollbar's gutter and drags the page sideways by it. */
      width: 100% !important;
      max-height: 82vh;
      max-height: 82dvh;
      border-radius: var(--r-lg) var(--r-lg) 0 0;
    }
    /* Reserve the bottom-nav's own height so the sheet's action buttons
       never land underneath it (was unreachable on iPhone — the sheet sat
       flush with the true viewport bottom, same spot the fixed bottom-nav
       occupies, at a slightly lower z-index than expected in some iOS
       webviews). Anchoring the sheet above the nav instead of relying on
       z-index stacking sidesteps that. */
    .picker-backdrop { align-items: flex-end; padding-bottom: calc(58px + env(safe-area-inset-bottom, 0px)); }

    /* Modal (e.g. change password) → bottom sheet, same as picker */
    .modal-box {
      width: 100% !important;   /* not 100vw — see .picker above */
      border-radius: var(--r-lg) var(--r-lg) 0 0;
    }
    .modal-backdrop { align-items: flex-end; padding-bottom: calc(58px + env(safe-area-inset-bottom, 0px)); }
    .modal-foot { padding-bottom: max(16px, env(safe-area-inset-bottom)); }

    /* Card body: less padding */
    .card-b { padding: 10px; }
    .card-h { padding: 11px 12px; }

    /* Disclaimer */
    .disclaimer-bar { font-size: 11px; padding: 6px 10px; }

    /* Seg control: full width. min-width:0 lets flex:1 buttons actually shrink
       below their text's intrinsic width instead of forcing the row to overflow
       (default flex min-width is `auto`, i.e. content size) — without it, long
       labels like "PN (ESPGHAN 2018)" push the last tab off-screen. Wrapping
       instead of truncating keeps the full citation readable on narrow phones. */
    .seg { width: 100%; }
    .seg button { flex: 1; min-width: 44px; padding: 8px 6px; font-size: 12px; white-space: normal; line-height: 1.25; text-align: center; }

    /* PresetChips: chips share one row wherever the row is wide enough, and
       wrap onto a second line only when honouring the 44px minimum would
       otherwise force them narrower. `flex: 1 1 44px` does both: 44px is the
       floor, and whatever is left over is shared out, so each line's chips
       still stretch flush rather than sitting ragged at content width.
       (Previously `flex: 1 1 0` + nowrap, which kept one row unconditionally
       and squeezed the 5-chip rows in half-width grid cells down to 26-31px
       wide — well under a fingertip, on controls that set clinical doses.)
       Small fixed font (not ellipsis/wrap) so a dose value never gets
       truncated or split across lines where a digit could be misread. */
    .preset-chips { flex-wrap: wrap; gap: 3px; }
    .preset-chip {
      flex: 1 1 44px; min-width: 44px; padding: 5px 1px; font-size: 10px;
      letter-spacing: -0.3px; white-space: nowrap; text-align: center;
      /* 44px tall hit area (iOS HIG / Android 48dp) — a 24px-tall chip was
         the smallest tap target in the app. */
      min-height: 44px;
      display: flex; align-items: center; justify-content: center;
    }

    /* Bottom nav visible */
    .bottom-nav {
      display: flex;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: calc(58px + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      background: var(--surface);
      border-top: 1.5px solid var(--line);
      z-index: 40;
      box-shadow: 0 -2px 12px oklch(25% 0.02 205 / .07);
    }

    .bnav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 6px 4px;
      cursor: pointer;
      border: none;
      background: none;
      color: var(--ink-4);
      font-size: 10px;
      font-weight: 500;
      font-family: inherit;
      transition: color .1s;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      min-height: 58px;
    }
    .bnav-item.active { color: var(--brand); }
    .bnav-item.active svg { stroke: var(--brand) !important; }

    /* Quick-calc button: above the bottom nav, clear of the home-indicator
       inset. It keeps its label at phone width rather than shrinking to a
       bare glyph: this is a new entry point nobody is looking for yet, and
       a word costs ~120px of a 390px screen over a list that scrolls under
       it. (The glyph itself is icons.jsx's stroked `calculator`, not the
       filled `calc` the rail uses — see the note there.) */
    .quick-fab {
      right: max(16px, env(safe-area-inset-right, 0px));
      bottom: calc(58px + env(safe-area-inset-bottom, 0px) + 14px);
      height: 46px;
      padding: 0 17px 0 14px;
      font-size: 13px;
      gap: 8px;
    }

    .bnav-badge {
      position: absolute;
      top: 6px;
      right: calc(50% - 20px);
      background: var(--crit);
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      min-width: 15px;
      height: 15px;
      border-radius: 999px;
      display: flex; align-items: center; justify-content: center;
      padding: 0 3px;
      border: 1.5px solid var(--surface);
      pointer-events: none;
    }
    /* Only the Alerts badge claims a severity (alarm fatigue, 2026-09-24).
       Cautions are the .chip.warn pairing — 6.8:1, where white on --warn is
       3.6:1 — so an unacknowledged critical stays the one solid red. The
       Dashboard's entry count is information, not an alarm: neutral. */
    .bnav-badge.warn    { background: var(--warn-bg); color: var(--warn-ink); border-color: var(--warn-line); }
    .bnav-badge.neutral { background: var(--bg-2); color: var(--ink-2); border-color: var(--line); }

    /* ── iOS: prevent auto-zoom on input focus (requires font-size ≥ 16px) ── */
    .inp, .sel { font-size: 16px !important; }

    /* ── Touch targets: minimum 44px on all interactive elements ── */
    /* min-width too, not just min-height — icon-only buttons (Growth's +/-,
       the bed-move actions) were 36-39px wide with a compliant height. */
    .btn       { min-height: 44px; min-width: 44px; }
    .btn.sm    { min-height: 44px; font-size: 13px; padding: 6px 12px; }
    .seg button { min-height: 44px; }
    /* The base .trend-xaxis-seg rule pins 28px with !important, so matching
       specificity + !important is the only way to lift it here. */
    .trend-xaxis-seg button { min-height: 44px !important; }
    /* Top-bar patient switcher: base rule sets height:36px; min-height clamps it. */
    .switch-patient { min-height: 44px; min-width: 44px; }
    /* Accordion step headers are the primary navigation of the calculator. */
    .card-h.clickable { min-height: 44px; }

    /* ── Active/pressed feedback for tappable surfaces ── */
    .card-h.clickable:active { background: var(--frame-head-2); }
    .preset-chip:active      { opacity: .7; transform: scale(0.97); }
    .rail-item:active        { background: var(--bg-2); }
    .btn:active              { opacity: .85; }

    /* ── Registry: hide table, show card list ── */
    .patient-table { display: none !important; }
    .patient-card-list { display: flex; flex-direction: column; gap: 10px; }
    .patient-mc {
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex; flex-direction: column; gap: 8px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform .1s, border-color .15s, background .15s;
    }
    .patient-mc:active { transform: scale(0.99); background: var(--bg-2); }
    .patient-mc.active { border-color: var(--brand); background: var(--brand-bg); }
    .patient-mc .pmc-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .patient-mc .pmc-head { justify-content: space-between; }
    .patient-mc .pmc-name { font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
    .patient-mc .pmc-dol  { font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600; color: var(--brand-2); }
    .patient-mc .pmc-meta { font-size: 12.5px; color: var(--ink-2); font-family: "IBM Plex Mono", monospace; }
    .patient-mc .pmc-diagnosis { font-size: 12.5px; color: var(--ink-2); line-height: 1.35; }
    .patient-mc .pmc-stats { font-size: 12px; color: var(--ink-2); gap: 14px; font-family: "IBM Plex Mono", monospace; }
    .patient-mc .pmc-lbl { color: var(--ink-3); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; margin-right: 2px; }
    /* Three actions since 2026-09-24 (UX roadmap #3): ⇄ bed, Edit, Open —
       the desktop row's order. One row from 360px up; below that a Thai
       label wraps at its word break inside a taller button rather than
       clipping (measured 280–430px in Chromium, verify-mobile-bed-button). */
    .patient-mc .pmc-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 2px; }
    .patient-mc .pmc-actions .btn { width: 100%; justify-content: center; text-align: center; min-height: 44px; }

    /* ── Trend graph: stack controls, scrollable chips with snap ── */
    .trend-controls > div:first-child { width: 100%; }
    .trend-controls > div:last-child { width: 100%; justify-content: flex-start; margin-left: 0 !important; }
    .trend-chips {
      flex-wrap: nowrap !important;
      overflow-x: auto;
      scroll-snap-type: x proximity;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 6px;
      margin: 0 -4px;
      padding-left: 4px; padding-right: 4px;
    }
    .trend-chips::-webkit-scrollbar { height: 4px; }
    .trend-chips::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; }
    .trend-chips > button {
      flex-shrink: 0 !important;
      min-height: 44px;
      padding: 8px 14px !important;
      font-size: 13px !important;
      scroll-snap-align: start;
    }

    /* ── Trend graph: Latest/Target/Δ stack as 2-col grid on mobile ── */
    .trend-latest > div { padding-right: 0; }
    .trend-latest > div::after { display: none !important; }
    .trend-latest {
      display: grid !important;
      grid-template-columns: 1fr 1fr;
      gap: 12px !important;
      align-items: flex-start !important;
    }
    .trend-latest > div:first-child { grid-column: 1 / -1; }

    /* ── Patient strip: identity row spans both columns on mobile ── */
    .patient-strip > div:nth-child(1) {
      grid-column: 1 / -1;
      border-right: none;
    }
    .patient-strip > div:nth-child(3),
    .patient-strip > div:nth-child(5) {
      border-right: none !important;
    }

    /* ── Alert row: stack acknowledge button below content ── */
    .alert-row { flex-wrap: wrap; }
    .alert-row > .btn { width: 100%; margin-top: 6px; justify-content: center; }

    /* ── Calculator save bar: static block, separated by a divider ──
       (previously position:sticky + negative margins — on short pages
       this made the sticky "bottom" offset resolve above its own
       static position, so it rendered on top of the patient-info line
       right above it. Plain flow avoids that class of bug entirely.) */
    .calc-save-bar {
      padding-top: 10px;
      margin-top: 4px;
      border-top: 1px solid var(--line-2);
    }
    .calc-save-bar .btn { min-height: 44px; }

    /* ── Bottom nav badge: tucked above icon, off-center to right ── */
    .bnav-badge {
      top: 4px !important;
      right: auto !important;
      left: calc(50% + 6px);
    }

    /* ── Modal safe-area padding ── */
    .picker { padding-bottom: env(safe-area-inset-bottom, 0px); }

    /* ── Registry stats/filter: stack on mobile ── */
