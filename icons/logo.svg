<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 137.2" role="img" aria-label="NeoFeed by Valhalla Health">
  <!-- The NeoFeed logo, Praew 2026-09-23: the N, "eo", "Feed" with a feeding
       bottle and a milk drop in its two e's, a Sage / Champagne Gold rule and
       "by VALHALLA HEALTH". Units: the N is 100 tall; its baseline is y = 100.
       The letters are Poppins ExtraBold ("eo") and Bold ("Feed", the byline),
       converted to outlines, so no font is needed to draw it (Poppins: SIL Open
       Font License 1.1, which permits this). The bottle and the drop replace
       each e's eye and are drawn, not type.
       The word alone (for small sizes) is this file above the rule:
       viewBox 0 0 456 100.9. app.jsx's <NeoFeedWordmark/> carries the same
       paths; test/verify-neofeed-mark.cjs pins them. -->
