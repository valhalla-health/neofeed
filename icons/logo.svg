<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 112.9" role="img" aria-label="NeoFeed">
  <!-- The NeoFeed logo, Praew 2026-09-23: the N, "eo", "Feed" with a feeding
       bottle and a milk drop in its two e's, and a two-tone rule. Units: the N
       is 100 tall; its baseline is y = 100.
       The letters are Poppins ExtraBold ("eo") and Bold ("Feed") converted to
       outlines, so no font is needed to draw it (Poppins: SIL Open Font License
       1.1, which permits this), and every corner is rounded (r 3, inner r 1.2)
       to match the N's own round corners. The bottle and the drop replace each
       e's eye and are drawn, not type. Two greens and a gold: the N's Forest
       ("eo"), the Sage family ("Feed" and the rule's left half, #476655), and
       Champagne Gold. "by Valhalla Health" is not part of the logo; the login
       screen sets it at its foot, beside the © line.
       The word alone (for small sizes) is this file above the rule:
       viewBox 0 0 456 100.9. app.jsx's <NeoFeedWordmark/> carries the same
       paths; test/verify-neofeed-mark.cjs pins them. -->
  <defs>
    <linearGradient id="nf-forest" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="100">
      <stop offset="0" stop-color="#335A4A"/>
      <stop offset="1" stop-color="#284C40"/>
    </linearGradient>
    <linearGradient id="nf-sage" gradientUnits="userSpaceOnUse" x1="0" y1="22" x2="0" y2="100">
      <stop offset="0" stop-color="#99B29C"/>
      <stop offset="1" stop-color="#799781"/>
    </linearGradient>
  </defs>
