<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- NeoFeed's app icon: the brand board's two-tone N on a framed jade tile.
       Praew, 2026-09-22 ("icon ใช้อันนี้").

       THE LETTER IS UNCHANGED and is the same two paths the wordmark draws —
       a Sage left stem, the diagonal and right stem in Forest, a slit between
       them. It is not traced from any mockup; it is built from the approved
       icon's measured proportions (stems 28% of the letter's height, a
       parallel-edged diagonal, 4.8% outer corners), and test/verify-neofeed-
       mark.cjs pins that app.jsx carries these exact path strings.

       WHAT IS NEW IS THE FRAME: an Ivory ring between a Pale Jade ground and
       the jade tile, which is what the approved artwork puts around the
       letter. Three concentric rects, measured off that artwork as fractions
       of the square: the ring's outer box is inset 7%, the ring is 6.4% thick,
       and the letter is 47% of the square, centred — it sits smaller than it
       did on the unframed tile because the frame takes the room.

       The ground is the ONLY rect whose rx the renderer strips for the
       full-bleed (maskable / Apple) variants — the ring and the tile keep
       their corners, or the frame stops being a frame. Every PNG in icons/ is
       rendered from this file; change it and re-render, or the harness fails
       on whichever half did not move. -->
  <defs>
    <linearGradient id="nf-forest" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="100">
      <stop offset="0" stop-color="#335A4A"/>
      <stop offset="1" stop-color="#284C40"/>
    </linearGradient>
    <linearGradient id="nf-sage" gradientUnits="userSpaceOnUse" x1="0" y1="22.5" x2="0" y2="100">
      <stop offset="0" stop-color="#99B29C"/>
      <stop offset="1" stop-color="#799781"/>
    </linearGradient>
  </defs>
  <rect id="nf-ground" width="256" height="256" rx="56" fill="#E4EDE0"/>
  <rect x="18" y="18" width="220" height="220" rx="50" fill="#F7F6EE"/>
  <rect x="34" y="34" width="188" height="188" rx="38" fill="#D3E3D3"/>
  <g transform="translate(68 67) scale(1.224)">
    <path fill="url(#nf-forest)" d="M0 4.8A4.8 4.8 0 0 1 4.8 0L25.76 0A4.8 4.8 0 0 1 29.44 1.71L70 50L70 4.8A4.8 4.8 0 0 1 74.8 0L93.2 0A4.8 4.8 0 0 1 98 4.8L98 95.2A4.8 4.8 0 0 1 93.2 100L81.14 100A4.8 4.8 0 0 1 77.46 98.29L28 39.4L0 16.5Z"/>
    <path fill="url(#nf-sage)" d="M0 22.5L28 45.4L28 95.2A4.8 4.8 0 0 1 23.2 100L4.8 100A4.8 4.8 0 0 1 0 95.2Z"/>
  </g>
</svg>
