<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- NeoFeed's two-tone N (Praew, 2026-09-22): the no-dot, shaded N from the
       approved Valhalla Health brand board — a lighter left stem, the diagonal
       and right stem darker, and a slit between them where the tile shows
       through. Built from the approved icon's measured proportions, not traced
       from it: stems 28% of the letter's height, a parallel-edged diagonal,
       4.8% outer corners.
       The GEOMETRY is the brand board's. The COLOURS are the Valhalla Teal
       sheet's, on Praew's 2026-09-22 second pass ("ลองใช้ logo ที่ทำใหม่ แต่ใช้
       palette สี valhalla teal") when the app went back to teal: the tile is
       Mineral Mist, the body is the brand ramp Valhalla Teal → Midnight Teal,
       the left stem is Sea Glass falling by the same 9.1 lightness points the
       board's own stem falls. Derived in oklch from the board's green mark, so
       every contrast inside the letter is the board's to within 0.2 — the
       shape reads exactly as it was drawn, in the app's family.
       The login wordmark and the in-app mark (app.jsx) draw these same two
       paths: one geometry. Every PNG in icons/ is rendered from this letter. -->
  <defs>
    <linearGradient id="nf-forest" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="100">
      <stop offset="0" stop-color="#12656A"/>
      <stop offset="1" stop-color="#103F43"/>
    </linearGradient>
    <linearGradient id="nf-sage" gradientUnits="userSpaceOnUse" x1="0" y1="22.5" x2="0" y2="100">
      <stop offset="0" stop-color="#78BFC0"/>
      <stop offset="1" stop-color="#5BA2A3"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="#D5ECEA"/>
  <g transform="translate(46.17 44.5) scale(1.67)">
    <path fill="url(#nf-forest)" d="M0 4.8A4.8 4.8 0 0 1 4.8 0L25.76 0A4.8 4.8 0 0 1 29.44 1.71L70 50L70 4.8A4.8 4.8 0 0 1 74.8 0L93.2 0A4.8 4.8 0 0 1 98 4.8L98 95.2A4.8 4.8 0 0 1 93.2 100L81.14 100A4.8 4.8 0 0 1 77.46 98.29L28 39.4L0 16.5Z"/>
    <path fill="url(#nf-sage)" d="M0 22.5L28 45.4L28 95.2A4.8 4.8 0 0 1 23.2 100L4.8 100A4.8 4.8 0 0 1 0 95.2Z"/>
  </g>
</svg>
