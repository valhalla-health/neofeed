<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- NeoFeed's two-tone N: the no-dot, shaded N from the brand board Praew
       approved on 2026-09-22 — a Sage left stem, the diagonal and right stem in
       Forest, and a slit between them where the tile shows through. Built from
       the approved icon's measured proportions, not traced from it: stems 28%
       of the letter's height, a parallel-edged diagonal, 4.8% outer corners.
       The tile (#D3E3D3) and the two gradients are sampled from that artwork;
       the Forest shading ends on Forest itself.

       THESE COLOURS ARE THE MARK'S OWN AND DO NOT FOLLOW THE APP'S PALETTE.
       They were re-tinted into the Valhalla Teal sheet when the app moved back
       to teal, and Praew put them straight back — "ขอกลับไปใช้ NeoFeed และหน้า
       login เดิม สีนี้". So the logo is green while the app's chrome is teal,
       on purpose: a mark is a mark, and this one matches the login screen and
       the icon on the home screen rather than the toolbar it sits in.

       The wordmark (app.jsx) draws these same two paths and these same four
       stops: one geometry, one palette. Every PNG in icons/ is rendered from
       this letter — change it and re-render, or the harness fails. -->
  <defs>
    <linearGradient id="nf-forest" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="100">
      <stop offset="0" stop-color="#335A4A"/>
      <stop offset="1" stop-color="#284C40"/>
    </linearGradient>
    <linearGradient id="nf-sage" gradientUnits="userSpaceOnUse" x1="0" y1="22.5" x2="0" y2="100">
      <stop offset="0" stop-color="#99B29C"/>
      <stop offset="1" stop-color="#799781"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="#D3E3D3"/>
  <g transform="translate(46.17 44.5) scale(1.67)">
    <path fill="url(#nf-forest)" d="M0 4.8A4.8 4.8 0 0 1 4.8 0L25.76 0A4.8 4.8 0 0 1 29.44 1.71L70 50L70 4.8A4.8 4.8 0 0 1 74.8 0L93.2 0A4.8 4.8 0 0 1 98 4.8L98 95.2A4.8 4.8 0 0 1 93.2 100L81.14 100A4.8 4.8 0 0 1 77.46 98.29L28 39.4L0 16.5Z"/>
    <path fill="url(#nf-sage)" d="M0 22.5L28 45.4L28 95.2A4.8 4.8 0 0 1 23.2 100L4.8 100A4.8 4.8 0 0 1 0 95.2Z"/>
  </g>
</svg>
