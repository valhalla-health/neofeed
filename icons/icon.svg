<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Valhalla Health "Luminous Protection" palette (Brand Handbook v1.1 § 11):
       a Forest-family gradient with the counter-dot picked out in Sage. The
       white stroke clears 5.85:1 on the lightest end of the gradient and
       9.57:1 on Forest itself. Re-tinted from teal on 2026-09-22 so the
       installed-app icon belongs to the same family as the app it opens. -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#486C5F"/>
      <stop offset="100%" stop-color="#284C40"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="url(#bg)"/>
  <g fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 88 182 L 88 76 L 168 182 L 168 92"/>
  </g>
  <circle cx="168" cy="76" r="12" fill="#B9CCB4"/>
</svg>
