schema: spec-driven

context: |
  NeoFeed is a NICU nutrition/TPN calculator in use at KCMH; its orders print for pharmacy.
  Specs, proposals and examples use synthetic infants only: never a real name, HN or bed history.
  A change that can move a dose names its source (TPN team decision, guideline) and bumps
  CONSTANTS_VERSION in data.js; one that only moves an alert threshold does not.
  Every clinical behaviour a spec adds or changes gets a case in a test/verify-*.cjs harness.
  After a .jsx edit, `npm ci --prefix tools && node tools/build.mjs` and commit compiled/ with it;
  CI fails on stale output.
  A push to main deploys nothing. Merging main into release deploys the frontend to both hosts;
  gas-backend.gs goes live only through an explicit clasp deploy, which needs Pp's go-ahead.

